<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="PDM"/>
  <meta name="theme-color" content="#0E1116"/>
  <title>PDM</title>
  <link rel="apple-touch-icon" href="icon.jpg"/>
  <link rel="manifest" href="manifest.json"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0E1116;font-family:-apple-system,sans-serif}
    body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
         padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    #root{min-height:100vh}
    #splash {
      position: fixed; inset: 0; z-index: 99999;
      background: #0E1116;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #splash-img {
      width: 33vw; height: 33vw; max-width: 150px; max-height: 150px;
      object-fit: contain; position: relative; z-index: 2;
      animation: splashImgIn .6s cubic-bezier(.34,1.56,.64,1) both;
    }
    #splash.go #splash-img {
      animation: splashImgOut 1s ease forwards;
    }
    #splash.go
    #splash.go
    @keyframes splashImgIn {
      from { opacity: 0; transform: scale(.8); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes splashImgOut {
      0%   { opacity: 1; transform: scale(1); }
      60%  { opacity: .8; transform: scale(1.35); }
      100% { opacity: 0; transform: scale(1.7); }
    }
      to   { opacity: 1; }
    }
      25%  { opacity: .7; }
      100% { transform: scaleX(3.5); opacity: 0; }
    }
    #splash {
      position: fixed; inset: 0; z-index: 99999;
      background: #0E1116;
      display: flex; align-items: center; justify-content: center;
    }
    #splash-scene {
      position: relative;
      width: 33vw; max-width: 160px;
      height: 33vw; max-height: 160px;
      display: flex; align-items: center; justify-content: center;
    }
    #splash img {
      width: 100%; height: 100%;
      object-fit: contain;
      position: relative; z-index: 2;
      animation: splashImgIn .7s cubic-bezier(.34,1.56,.64,1) both;
    }
    .spl-line {
      height: 1.5px; background: rgba(255,255,255,.45);
      transform-origin: left; border-radius: 1px;
      transform: scaleX(0); opacity: 0;
    }
    #splash.go img {
      animation: splashImgOut 1s ease forwards;
    }
    #splash.go .spl-line {
      animation: splashLine .9s ease forwards;
    }
    #splash.go .spl-line:nth-child(1){animation-delay:.00s;width:65%}
    #splash.go .spl-line:nth-child(2){animation-delay:.04s;width:75%}
    #splash.go .spl-line:nth-child(3){animation-delay:.02s;width:90%}
    #splash.go .spl-line:nth-child(4){animation-delay:.06s;width:60%}
    #splash.go .spl-line:nth-child(5){animation-delay:.03s;width:80%}
    #splash.go .spl-line:nth-child(6){animation-delay:.05s;width:70%}
    @keyframes splashImgIn {
      from { opacity: 0; transform: scale(.82); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes splashImgOut {
      0%   { opacity: 1; transform: scale(1); }
      60%  { opacity: 1; transform: scale(1.25); }
      100% { opacity: 0; transform: scale(1.55); }
    }
    @keyframes splashLine {
      0%   { transform: scaleX(0); opacity: 0; }
      25%  { transform: scaleX(1); opacity: .55; }
      100% { transform: scaleX(3.5); opacity: 0; }
    }
      to   { opacity: 0; transform: scale(1.15); }
    }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
