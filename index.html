  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0E1116;font-family:-apple-system,sans-serif}
    body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
         padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    #root{min-height:100vh}
    #splash {
      position: fixed; inset: 0; z-index: 99999;
      background: #0E1116;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 1.2s ease;
    }
    #splash img {
      width: 33vw; height: 33vw; max-width: 150px; max-height: 150px;
      object-fit: contain;
      animation: splashImgIn 1.4s ease both;
    }
    #splash.go {
      opacity: 0;
      pointer-events: none;
    }
    #splash.go img {
      animation: splashImgOut 1.2s ease forwards;
    }
    @keyframes splashImgIn {
      0%   { opacity: 0; transform: scale(.88); }
      60%  { opacity: 1; transform: scale(1.06); }
      80%  { transform: scale(.98); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes splashImgOut {
      0%   { opacity: 1; transform: scale(1); }
      50%  { opacity: 1; transform: scale(1.18); }
      100% { opacity: 0; transform: scale(1.45); }
    }
    </style>
</head>

\u2022 Sortie en roue : si tu bascules trop loin, tourne les \xE9paules d'un c\xF4t\xE9 et pose un pied puis l'autre, comme une demi-roue.
\u2022 Pirouette : tourne les mains et le corps d'un quart de tour pour reposer les pieds.
\u2022 Ne jamais plier les bras vers l'avant pour se rattraper.

\u2022 Doigts point\xE9s vers toi, paumes au sol : 20\u201330 s.
\u2022 Dos de la main au sol, pression douce : 20\u201330 s.
\u2022 Cercles d'\xE9paules + dislocations au b\xE2ton : 10 lentes.
\u2022 \xC9tirement \xE9paule au mur : 30 s/c\xF4t\xE9.`},{id:je(),title:"Le socle (3 briques)",body:`Trois qualit\xE9s \xE0 construire en parall\xE8le d\xE8s le d\xE9but :
\u2022 Hollow body : dos plaqu\xE9 au sol, \xE9paules et jambes d\xE9coll\xE9es. 3 \xD7 20\u201340 s. C'est LA position du corps en handstand.
\u2022 Force verticale : pike push-ups (pompes en V), puis pieds sur\xE9lev\xE9s. 3 \xD7 5\u201310.
\u2022 Alignement : c'est tout l'objet des tenues au mur.`},{id:je(),title:"Phase 1 \u2014 Mur poitrine",body:`Objectif : endurance d'\xE9paules + ligne droite, sans g\xE9rer l'\xE9quilibre.

\u2022 4\u20136 tenues de 15\u201340 s, r\xE9cup 60\u201390 s.
\u2022 Cues : pousse le sol loin, regarde tes mains, serre fesses et jambes, pointe les pieds.
Crit\xE8re de passage : 40 s dos plat + savoir sortir en roue.`},{id:je(),title:"Phase 2 \u2014 \xC9quilibre & pilotage des doigts",body:`Objectif : trouver le point d'\xE9quilibre et piloter avec les mains.
\u2022 Dos au mur : \xE9loigne un pied puis l'autre, cherche \xE0 d\xE9coller quelques secondes.
\u2022 Shoulder taps au mur : d\xE9colle une main puis l'autre. 3 \xD7 3\u20135/main.
\u2022 Pilotage par les doigts (le secret) : en \xE9quilibre, on ne bouge pas le corps \u2014 on APPUIE sur les doigts pour ne pas partir en avant, on rel\xE2che pour corriger l'inverse.
\u2022 Kick-up : impulsion mesur\xE9e de la jambe arri\xE8re pour empiler les hanches au-dessus des \xE9paules.
Crit\xE8re : d\xE9coller 2\u20135 s de fa\xE7on r\xE9p\xE9t\xE9e et corriger par les doigts.`},{id:je(),title:"Phase 3 \u2014 Handstand libre",body:`Objectif : transformer le flottement en tenue droite et contr\xF4l\xE9e.
\u2022 Multiplie les essais courts, additionne le temps total (viser ~60 s cumul\xE9es de qualit\xE9), puis allonge les tenues.
\u2022 Alignement fin : filme-toi de profil, empile poignets\u2013\xE9paules\u2013hanches\u2013chevilles.
\u2022 Entr\xE9es propres en tuck ou straddle pour ne plus d\xE9pendre du mur.
Crit\xE8re \xAB handstand solide \xBB : ~30 s libre, droit, entr\xE9e + sortie ma\xEEtris\xE9es.`},{id:je(),title:"S\xE9ance type & fr\xE9quence",body:`S\xE9ance type (~15\u201320 min) :
1. \xC9chauffement poignets/\xE9paules \u2014 5 min
2. Sorties/chutes (phases 1\u20132) \u2014 2 min
3. Drill principal de ta phase \u2014 8\u201310 min (essais courts, r\xE9cup g\xE9n\xE9reuse)
4. Renfort : hollow + pike push-ups \u2014 3\u20134 min
5. 1 tenue \xAB max \xBB de fin
Fr\xE9quence : id\xE9alement 5\u20136 jours/semaine, court. L'\xE9quilibre est une comp\xE9tence nerveuse : la r\xE9p\xE9tition fr\xE9quente prime.`},{id:je(),title:"Erreurs fr\xE9quentes",body:`\u2022 Cambrer (banane) : rentre les c\xF4tes, serre les fesses, pense \xAB hollow \xBB.

\u2022 Sur-kick (tu passes devant) : impulsion plus douce.
\u2022 Sauter l'\xE9chauffement poignets : douleurs qui stoppent la progression.

<script>
(function() {
  var splash = document.getElementById('splash');
  var appReady = false;
  var timerDone = false;
  function tryDismiss() {
    if (!appReady || !timerDone) return;
    splash.classList.add('go');
    setTimeout(function() { splash.style.display = 'none'; }, 1200);
  }
  var observer = new MutationObserver(function() {
    var root = document.getElementById('root');
    if (root && root.children.length > 0) {
      observer.disconnect();
      appReady = true;
      tryDismiss();
    }
  });
  observer.observe(document.getElementById('root'), { childList: true, subtree: true });
  window.addEventListener('load', function() {
    setTimeout(function() { timerDone = true; tryDismiss(); }, 2000);
  });
})();
</script>
