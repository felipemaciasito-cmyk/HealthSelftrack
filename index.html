function HoldToStart({ color, label, icon, onUnlock, holdMs = 650 }) {
  const [pct, setPct] = useState(0);
  const [holding, setHolding] = useState(false);
  const raf = useRef(null);
  const startedAt = useRef(0);
  const doneRef = useRef(false);
  const Icon = icon;

  const tick = () => {
    const elapsed = Date.now() - startedAt.current;
    const p = Math.min(1, elapsed / holdMs);
    setPct(p);
    if (p >= 1) {
      if (!doneRef.current) {
        doneRef.current = true;
        if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(20);
        onUnlock();
      }
      return;
    }
    raf.current = requestAnimationFrame(tick);
  };
  const onDown = (e) => {
    e.preventDefault();
    doneRef.current = false;
    startedAt.current = Date.now();
    setHolding(true);
    raf.current = requestAnimationFrame(tick);
  };
  const onUp = () => {
    if (doneRef.current) return;
    if (raf.current) cancelAnimationFrame(raf.current);
    setHolding(false);
    setPct(0);
  };
  useEffect(() => () => { if (raf.current) cancelAnimationFrame(raf.current); }, []);

  const r = 21, CIRC = 2 * Math.PI * r;
  return (
    <div onPointerDown={onDown} onPointerUp={onUp} onPointerLeave={onUp} onPointerCancel={onUp} onContextMenu={(e) => e.preventDefault()}
      className="relative rounded-2xl flex items-center justify-center gap-3 active:scale-[0.98]"
      style={{
        height: 58, background: color + "1E", border: `1.5px solid ${color}`, touchAction: "none",
        userSelect: "none", WebkitUserSelect: "none", WebkitTouchCallout: "none", cursor: "pointer",
      }}>
      <div className="relative" style={{ width: 46, height: 46, flexShrink: 0 }}>
        <svg width="46" height="46" style={{ position: "absolute", inset: 0, transform: "rotate(-90deg)" }}>
          <circle cx="23" cy="23" r={r} fill="none" stroke={color + "33"} strokeWidth="4" />
          <circle cx="23" cy="23" r={r} fill="none" stroke={color} strokeWidth="4" strokeLinecap="round"
            strokeDasharray={CIRC} strokeDashoffset={CIRC * (1 - pct)} style={{ transition: holding ? "none" : "stroke-dashoffset .2s ease" }} />
        </svg>
        <div className="absolute inset-0 flex items-center justify-center"><Icon size={19} color={color} /></div>
      </div>
      <span className="font-extrabold text-sm tracking-widest" style={{ color }}>{holding ? "MAINTIENS…" : label}</span>
    </div>
  );
}

function FloatingCountdown({ left, total, color, label, onTap }) {
  const [pos, setPos] = useState(null);
  const ptr = useRef({ x0: 0, y0: 0, l0: 0, t0: 0, moved: false });
  useEffect(() => {
    (async () => {
      const saved = await loadKey("ft:chronoPos", null);
      if (saved && typeof saved.left === "number") setPos(saved);
      else setPos({ left: typeof window !== "undefined" ? window.innerWidth - 76 : 300, top: 96 });
    })();
  }, []);
  if (!pos) return null;
  const SIZE = 60;
  const vw = typeof window !== "undefined" ? window.innerWidth : 400;
  const vh = typeof window !== "undefined" ? window.innerHeight : 700;
  const clamp = (l, t) => ({ left: Math.max(6, Math.min(vw - SIZE - 6, l)), top: Math.max(58, Math.min(vh - SIZE - 6, t)) });
  const onDown = (e) => { e.preventDefault(); e.currentTarget.setPointerCapture(e.pointerId); ptr.current = { x0: e.clientX, y0: e.clientY, l0: pos.left, t0: pos.top, moved: false }; };
  const onMove = (e) => {
    const dx = e.clientX - ptr.current.x0, dy = e.clientY - ptr.current.y0;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) { ptr.current.moved = true; setPos(clamp(ptr.current.l0 + dx, ptr.current.t0 + dy)); }
  };
  const onUp = () => { if (ptr.current.moved) { setPos((p) => { saveKey("ft:chronoPos", p); return p; }); } else onTap(); };
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;
  const pct = total ? Math.max(0, Math.min(1, left / total)) : 0;
  const r = 27, C_ = 2 * Math.PI * r;

  return (
    <div onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onContextMenu={(e) => e.preventDefault()}
      style={{
        position: "fixed", left: pos.left, top: pos.top, zIndex: 62, width: SIZE, height: SIZE, borderRadius: "50%",
        display: "flex", alignItems: "center", justifyContent: "center", touchAction: "none", cursor: "grab",
        background: `radial-gradient(circle at 50% 35%, ${color}59, ${color}14 70%)`,
        border: `1.5px solid ${color}`, boxShadow: `0 8px 22px ${color}40`,
        userSelect: "none", WebkitUserSelect: "none", WebkitTouchCallout: "none",
      }}
      title="Tap : terminer l'échauffement (à valider) · Glisser : déplacer">
      <svg width={SIZE} height={SIZE} style={{ position: "absolute", inset: 0, transform: "rotate(-90deg)" }}>
        <circle cx={SIZE / 2} cy={SIZE / 2} r={r} fill="none" stroke={color + "33"} strokeWidth="3" />
        <circle cx={SIZE / 2} cy={SIZE / 2} r={r} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round"
          strokeDasharray={C_} strokeDashoffset={C_ * (1 - pct)} style={{ transition: "stroke-dashoffset 1s linear" }} />
      </svg>
      <div className="flex flex-col items-center">
        <span className="font-mono font-extrabold" style={{ color, fontSize: 13 }}>{fmt(Math.max(0, left))}</span>
        <span style={{ fontSize: 7, color, fontWeight: 800, textTransform: "uppercase", letterSpacing: ".06em", opacity: .85 }}>{label}</span>
      </div>
    </div>
  );
}

function WarmupCard({ stage, left, total, pendingUsed, warmupSec, fmt, onUnlock, onPick, onRelaunch, onValidate }) {
  const gold = C.gold;
  const pulseVar = { "--pulse-color": gold + "55" };
  const cardStyle = { background: `linear-gradient(160deg, ${gold}22, ${C.surface})`, border: `1px solid ${gold}88`, boxShadow: `0 6px 18px ${gold}1A` };
  const iconBox = <div className="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: gold + "30" }}><Flame size={17} color={gold} /></div>;

  if (stage === "locked") {
    return (
      <div className="unlock-pulse rounded-2xl p-4" style={{ ...pulseVar, ...cardStyle }}>
        <div className="flex items-center gap-2.5 mb-3">
          {iconBox}
          <div className="font-extrabold text-[15px]">Échauffement</div>
        </div>
        <HoldToStart color={gold} label="START" icon={Play} onUnlock={onUnlock} />
      </div>
    );
  }
  if (stage === "select") {
    return (
      <div className="unlock-pulse rounded-2xl p-4" style={{ ...pulseVar, ...cardStyle }}>
        <div className="flex items-center gap-2.5 mb-3">
          {iconBox}
          <div className="font-extrabold text-[15px]">Échauffement</div>
        </div>
        <div className="flex gap-2">
          {[3, 5, 7, 10].map((m) => (
            <button key={m} onClick={() => onPick(m)} className="flex-1 py-3 rounded-xl font-mono font-extrabold text-sm active:scale-95"
              style={{ background: gold + "28", border: `1px solid ${gold}88`, color: gold }}>{m}′</button>
          ))}
        </div>
      </div>
    );
  }
  if (stage === "counting") {
    return (
      <div className="rounded-2xl p-4" style={cardStyle}>
        <div className="flex items-center gap-2.5">
          {iconBox}
          <div className="flex-1 font-extrabold text-[15px]">Échauffement</div>
          <span className="font-mono font-extrabold" style={{ color: gold, fontSize: 19 }}>{fmt(left)}</span>
        </div>
      </div>
    );
  }
  if (stage === "confirm") {
    return (
      <div className="rounded-2xl p-4" style={cardStyle}>
        <div className="flex items-center gap-2.5 mb-3">
          {iconBox}
          <div><div className="font-extrabold text-[15px]">Terminer ?</div><div className="text-[11px] font-mono" style={{ color: C.muted }}>{fmt(pendingUsed)}</div></div>
        </div>
        <div className="flex gap-2">
          <button onClick={onRelaunch} className="flex-1 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95"
            style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>
            <RotateCcw size={13} /> Relancer
          </button>
          <button onClick={onValidate} className="flex-1 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95"
            style={{ background: C.green, border: "none", color: "#0E1116" }}>
            <Check size={14} strokeWidth={3} /> Valider
          </button>
        </div>
      </div>
    );
  }
  // done
  return (
    <div className="node-shine rounded-2xl p-3.5 flex items-center gap-2.5 mb-1" style={{ background: `linear-gradient(160deg, ${gold}16, ${C.surface})`, border: `1px solid ${gold}70` }}>
      {iconBox}
      <div className="flex-1 font-extrabold text-sm">Échauffement</div>
      <span className="inline-flex items-center gap-1 text-[11px] font-extrabold rounded-full px-2.5 py-1" style={{ background: gold, color: "#0E1116" }}>
        <Check size={11} strokeWidth={3} /> {fmt(warmupSec || 0)}
      </span>
    </div>
  );
}

function SessionBuilder({ draft, setDraft, onSave, onCancel, onDiscard, hasDraft, knownPartners = [], sessions = [] }) {
  const run = isRun(draft);
  const [partnerInput, setPartnerInput] = useState("");
  const partners = draft.partners || [];
  const addPartner = (name) => {
    const n = (name || "").trim();
    if (!n || partners.includes(n)) { setPartnerInput(""); return; }
    setDraft({ ...draft, partners: [...partners, n] });
    setPartnerInput("");
  };
  const rmPartner = (n) => setDraft({ ...draft, partners: partners.filter((p) => p !== n) });
  const upd = (patch) => setDraft({ ...draft, ...patch });
  const updEx = (i, patch) => { const ex = [...draft.exercises]; ex[i] = { ...ex[i], ...patch }; upd({ exercises: ex }); };
  const updSet = (ei, si, patch) => {
    const ex = [...draft.exercises]; const sets = [...ex[ei].sets]; sets[si] = { ...sets[si], ...patch };
    ex[ei] = { ...ex[ei], sets }; upd({ exercises: ex });
  };
  const addEx = () => upd({ exercises: [...draft.exercises, { name: "", kind: "dynamic", sets: [{ reps: "", hold: "", weight: "", rpe: "" }] }] });
  const insertExAt = (idx) => {
    const ex = [...draft.exercises];
    ex.splice(idx, 0, { name: "", kind: "dynamic", sets: [{ reps: "", hold: "", weight: "", rpe: "" }] });
    upd({ exercises: ex });
  };
  const moveEx = (from, to) => {
    if (to < 0 || to >= draft.exercises.length || from === to) return;
    const ex = [...draft.exercises];
    const [item] = ex.splice(from, 1);
    ex.splice(to, 0, item);
    upd({ exercises: ex });
  };
  const rmEx = (i) => upd({ exercises: draft.exercises.filter((_, x) => x !== i) });
  const addSet = (ei) => { const ex = [...draft.exercises]; ex[ei] = { ...ex[ei], sets: [...ex[ei].sets, { reps: "", hold: "", weight: "", rpe: "" }] }; upd({ exercises: ex }); };
  const quickRepeatSet = (ei) => {
    const ex = [...draft.exercises];
    const sets = ex[ei].sets;
    const last = sets[sets.length - 1] || {};
    ex[ei] = { ...ex[ei], sets: [...sets, { reps: last.reps || "", hold: last.hold || "", weight: last.weight || "", rpe: last.rpe || "" }] };
    upd({ exercises: ex });
  };
  const rmSet = (ei, si) => { const ex = [...draft.exercises]; ex[ei] = { ...ex[ei], sets: ex[ei].sets.filter((_, x) => x !== si) }; upd({ exercises: ex }); };

  // ---- Réorganisation des exercices par glisser-déposer ----
  const cardRefs = useRef([]);
  const [dragEx, setDragEx] = useState(null); // { idx, startY, dy }
  const onGripDown = (ei) => (e) => {
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    setDragEx({ idx: ei, startY: e.clientY, dy: 0 });
  };
  const onGripMove = (e) => {
    if (!dragEx) return;
    setDragEx((d) => (d ? { ...d, dy: e.clientY - d.startY } : d));
  };
  const onGripUp = () => {
    if (!dragEx) return;
    const draggedRect = cardRefs.current[dragEx.idx]?.getBoundingClientRect();
    if (draggedRect) {
      const draggedCenterY = draggedRect.top + draggedRect.height / 2 + dragEx.dy;
      const others = draft.exercises.map((_, i) => i).filter((i) => i !== dragEx.idx);
      let insertPos = others.length;
      for (let k = 0; k < others.length; k++) {
        const r = cardRefs.current[others[k]]?.getBoundingClientRect();
        if (r && draggedCenterY < r.top + r.height / 2) { insertPos = k; break; }
      }
      if (insertPos !== dragEx.idx) {
        moveEx(dragEx.idx, insertPos);
        if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(12);
      }
    }
    setDragEx(null);
  };

  const totalChronoSec = draft.exercises.reduce((sum, ex) => sum + (ex.sets || []).reduce((s2, set) => s2 + (parseFloat(set.time) || 0) + (parseFloat(set.rest) || 0), 0), 0)
    + (parseFloat(draft.extraRestSec) || 0) + (parseFloat(draft.warmupSec) || 0);
  const isExDone = (ex) => ex.name.trim().length > 0;
  const doneExCount = draft.exercises.filter(isExDone).length;
  const exProgressPct = draft.exercises.length ? Math.round((doneExCount / draft.exercises.length) * 100) : 0;
  const totalChronoMin = totalChronoSec > 0 ? Math.round((totalChronoSec / 60) * 10) / 10 : 0;
  useEffect(() => {
    if (run || totalChronoSec <= 0) return;
    const rounded = String(totalChronoMin);
    if (draft.durationMin !== rounded) upd({ durationMin: rounded });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [totalChronoSec]);

  const canSave = run ? (draft.distanceKm || draft.durationMin) : (draft.name || draft.exercises.some((e) => e.name));
  const editing = !!draft.editing;

  // ---- Parcours verrouillé : échauffement (jaune/or) → exercices (orange) ----
  const lockFlowActive = !run && !editing && draft.date === todayISO();
  const [warmupStage, setWarmupStage] = useState(() => (lockFlowActive && draft.warmupSec == null ? "locked" : "done"));
  const [warmupTotal, setWarmupTotal] = useState(0);
  const [warmupLeft, setWarmupLeft] = useState(0);
  const [pendingUsed, setPendingUsed] = useState(0);
  const [exLocked, setExLocked] = useState(() => lockFlowActive && !draft.exLockDone);
  useEffect(() => {
    if (warmupStage !== "counting") return undefined;
    if (warmupLeft <= 0) { setPendingUsed(warmupTotal); setWarmupStage("confirm"); return undefined; }
    const t = setTimeout(() => setWarmupLeft((l) => l - 1), 1000);
    return () => clearTimeout(t);
  }, [warmupStage, warmupLeft, warmupTotal]);
  const unlockWarmup = () => { setWarmupStage("select"); };
  const pickWarmupDuration = (min) => {
    const total = min * 60;
    setWarmupTotal(total); setWarmupLeft(total); setWarmupStage("counting");
    if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(14);
  };
  const requestWarmupConfirm = () => { setPendingUsed(warmupTotal - warmupLeft); setWarmupStage("confirm"); };
  const relaunchWarmup = () => {
    upd({ warmupSec: Math.round((parseFloat(draft.warmupSec) || 0) + pendingUsed) });
    setWarmupStage("select"); setWarmupTotal(0); setWarmupLeft(0);
  };
  const validateWarmup = () => {
    upd({ warmupSec: Math.round((parseFloat(draft.warmupSec) || 0) + pendingUsed) });
    setWarmupStage("done");
    if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate([15, 40, 15]);
  };
  const unlockExercises = () => {
    setExLocked(false);
    upd({ exLockDone: true });
    startChrono("effort");
  };

  const workoutSessions = sessions.filter((s) => !isRun(s) && Array.isArray(s.exercises));
  const knownExercises = Array.from(new Set([
    ...workoutSessions.flatMap((s) => s.exercises.map((e) => (e.name || "").trim()).filter(Boolean)),
    ...(draft.exercises || []).map((e) => (e.name || "").trim()).filter(Boolean),
  ])).sort((a, b) => a.localeCompare(b));
  const lastPerf = (name) => {
    const n = (name || "").trim().toLowerCase();
    if (!n) return null;
    for (const s of workoutSessions) {
      if (s.id === draft.id) continue;
      const m = s.exercises.find((e) => (e.name || "").trim().toLowerCase() === n && e.sets && e.sets.length);
      if (m) return { date: s.date, sets: m.sets };
    }
    return null;
  };

  // ---- Chrono Option A : bascule Effort / Repos ----
  const fmtSec = (s) => `${Math.floor(s / 60)}:${String(Math.round(s) % 60).padStart(2, "0")}`;
  const [chrono, setChrono] = useState({ mode: "idle", elapsed: 0 }); // idle | effort | repos
  const [activeEx, setActiveEx] = useState(0);
  const lastTimed = useRef(null); // { ei, si }
  useEffect(() => {
    if (chrono.mode === "idle") return undefined;
    const t = setTimeout(() => setChrono((c) => ({ ...c, elapsed: c.elapsed + 1 })), 1000);
    return () => clearTimeout(t);
  }, [chrono]);

  const assignSegment = (mode, sec) => {
    if (!sec) return;
    const ei = Math.min(activeEx, draft.exercises.length - 1);
    if (mode === "effort") {
      if (ei < 0) return;
      const ex = [...draft.exercises];
      const sets = [...ex[ei].sets];
      let si = sets.findIndex((s) => !s.time);
      if (si === -1) { sets.push({ reps: "", hold: "", weight: "", rpe: "" }); si = sets.length - 1; }
      sets[si] = { ...sets[si], time: sec };
      ex[ei] = { ...ex[ei], sets };
      lastTimed.current = { ei, si };
      upd({ exercises: ex });
    } else {
      const lt = lastTimed.current;
      if (lt && draft.exercises[lt.ei] && draft.exercises[lt.ei].sets[lt.si]) {
        const ex = [...draft.exercises];
        const sets = [...ex[lt.ei].sets];
        sets[lt.si] = { ...sets[lt.si], rest: (parseFloat(sets[lt.si].rest) || 0) + sec };
        ex[lt.ei] = { ...ex[lt.ei], sets };
        upd({ exercises: ex });
      } else {
        // Repos sans série précédente (ex : échauffement en tout début de séance) — on le compte quand même dans le total.
        upd({ extraRestSec: (parseFloat(draft.extraRestSec) || 0) + sec });
      }
    }
  };
  const startChrono = (mode = "effort") => { lastTimed.current = null; setChrono({ mode, elapsed: 0 }); };
  const toggleChrono = () => {
    if (chrono.mode === "idle") { setChrono({ mode: "effort", elapsed: 0 }); return; }
    assignSegment(chrono.mode, chrono.elapsed);
    if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(15);
    setChrono({ mode: chrono.mode === "effort" ? "repos" : "effort", elapsed: 0 });
  };
  const stopChrono = () => {
    if (chrono.mode !== "idle") assignSegment(chrono.mode, chrono.elapsed);
    setChrono({ mode: "idle", elapsed: 0 });
  };
  const chronoIsEffort = chrono.mode === "effort";
  const chronoActive = chrono.mode !== "idle";

  return (
    <Overlay title={editing ? "Modifier la séance" : "Nouvelle séance"} onBack={onCancel}
      footer={
        <div>
          {!editing && (
            <div className="flex items-center justify-center gap-1.5 text-[11px] mb-2" style={{ color: C.muted }}>
              <Check size={12} color={C.green} /> Brouillon sauvegardé — tu peux fermer et reprendre plus tard
            </div>
          )}
          <Btn className="w-full" onClick={() => onSave(draft)} disabled={!canSave}>
            <span className="flex items-center justify-center gap-2"><Save size={16} /> Enregistrer la séance</span></Btn>
          {!editing && draftHasContent(draft) && (
            <button onClick={onDiscard} className="w-full text-center text-xs font-semibold mt-3 py-1" style={{ color: "#F87171" }}>
              Abandonner cette séance
            </button>
          )}
        </div>
      }>

      {!run && warmupStage === "counting" && (
        <FloatingCountdown left={warmupLeft} total={warmupTotal} color={C.gold} label="Échauf." onTap={requestWarmupConfirm} />
      )}
      {!run && (warmupStage !== "counting") && !(lockFlowActive && (warmupStage !== "done" || exLocked)) && (
        <FloatingChrono active={chronoActive} isEffort={chronoIsEffort} elapsed={chrono.elapsed} fmt={fmtSec}
          onToggle={toggleChrono} onStop={stopChrono} onStart={startChrono} />
      )}

      {/* type de séance */}
      <div className="grid grid-cols-2 gap-2 mb-4">
        {[{ id: "workout", label: "Callisthénie", icon: CalisIcon, col: C.ember },
          { id: "run", label: "Course", icon: RunIcon, col: C.sky }].map((t) => {
          const active = draft.type === t.id;
          return (
            <button key={t.id} onClick={() => upd({ type: t.id })}
              className="flex items-center justify-center gap-2 py-3 rounded-xl font-semibold text-sm"
              style={{ background: active ? t.col + "22" : C.surface, border: `1px solid ${active ? t.col : C.border}`, color: active ? t.col : C.muted }}>
              <t.icon size={18} /> {t.label}
            </button>
          );
        })}
      </div>

      <div className="grid grid-cols-2 gap-3 mb-1">
        <Field label="Nom (option.)"><input className={inputCls} style={inputStyle} value={draft.name} onChange={(e) => upd({ name: e.target.value })} placeholder={run ? "Ex : Footing matin" : "Ex : Tirage / abdos"} /></Field>
        <Field label="Date"><input type="date" className={inputCls} style={inputStyle} value={draft.date} onChange={(e) => upd({ date: e.target.value })} /></Field>
      </div>
      {!run && draft.date !== todayISO() && (
        <div className="rounded-lg px-3 py-2 mb-4 text-[11px]" style={{ background: C.surface2, color: C.muted, border: `1px solid ${C.border}` }}>
          Séance datée d'un autre jour — pas besoin d'échauffement live, tu remplis directement.
        </div>
      )}
      {!run && draft.date === todayISO() && <div className="mb-4" />}

      {lockFlowActive && warmupStage !== "done" ? (
        <WarmupCard stage={warmupStage} left={warmupLeft} total={warmupTotal} pendingUsed={pendingUsed} warmupSec={draft.warmupSec} fmt={fmtSec}
          onUnlock={unlockWarmup} onPick={pickWarmupDuration} onRelaunch={relaunchWarmup} onValidate={validateWarmup} />
      ) : (
      <>
      {run ? (
        <>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Distance (km)"><input inputMode="decimal" className={inputCls + " font-mono"} style={inputStyle} value={draft.distanceKm} onChange={(e) => upd({ distanceKm: e.target.value })} placeholder="ex : 5.2" /></Field>
            <Field label="Durée (min)"><input inputMode="decimal" className={inputCls + " font-mono"} style={inputStyle} value={draft.durationMin} onChange={(e) => upd({ durationMin: e.target.value })} placeholder="ex : 28" /></Field>
          </div>
          {runPace(draft) && (
            <div className="rounded-lg px-3 py-2 mb-3 text-sm flex items-center gap-2" style={{ background: C.surface2, color: C.sky }}>
              <Activity size={15} /> Allure : <span className="font-mono font-bold">{fmtPace(runPace(draft))}</span>
            </div>
          )}
          <Field label="Type de sortie">
            <div className="flex gap-2">
              {["continu", "fractionné"].map((k) => (
                <button key={k} onClick={() => upd({ runKind: k })} className="flex-1 py-2 rounded-lg text-sm capitalize"
                  style={{ background: draft.runKind === k ? C.sky + "22" : C.surface2, border: `1px solid ${draft.runKind === k ? C.sky : C.border}`, color: draft.runKind === k ? C.sky : C.muted }}>{k}</button>
              ))}
            </div>
          </Field>
        </>
      ) : (
        <>
          {lockFlowActive && (
            <WarmupCard stage="done" warmupSec={draft.warmupSec} fmt={fmtSec} onUnlock={() => {}} onPick={() => {}} onRelaunch={() => {}} onValidate={() => {}} />
          )}
          {lockFlowActive && exLocked && (
            <div className="unlock-pulse rounded-2xl p-4 mb-3" style={{ "--pulse-color": C.ember + "55", background: `linear-gradient(160deg, ${C.ember}1E, ${C.surface})`, border: `1px solid ${C.ember}88` }}>
              <div className="flex items-center gap-2.5 mb-3">
                <div className="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: C.ember + "30" }}><Dumbbell size={17} color={C.ember} /></div>
                <div className="font-extrabold text-[15px]">Exercices</div>
              </div>
              <HoldToStart color={C.ember} label="GO" icon={Dumbbell} onUnlock={unlockExercises} />
            </div>
          )}
          <div style={lockFlowActive && exLocked ? { filter: "blur(3px)", opacity: .4, pointerEvents: "none" } : undefined}>
          {draft.exercises.length > 1 && (
            <div className="flex items-center gap-2 mb-3">
              <div className="flex-1 h-1.5 rounded-full overflow-hidden" style={{ background: C.surface2 }}>
                <div className="bar-fill" style={{ height: "100%", width: `${exProgressPct}%`, background: `linear-gradient(90deg, ${C.ember}, #ffb088)`, borderRadius: 99 }} />
              </div>
              <span className="text-[11px] font-bold flex-shrink-0" style={{ color: C.ember }}>{doneExCount}/{draft.exercises.length} exos</span>
            </div>
          )}
          {chronoActive && (
            <div className="rounded-lg px-3 py-2 mb-3 text-[11px] flex items-center gap-2" style={{ background: (chronoIsEffort ? C.ember : C.sky) + "12", border: `1px solid ${(chronoIsEffort ? C.ember : C.sky)}44`, color: chronoIsEffort ? C.ember : C.sky }}>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: chronoIsEffort ? C.ember : C.sky }} />
              {chronoIsEffort ? "Effort en cours" : "Repos en cours"} — tape le chrono flottant pour basculer{draft.exercises.length > 1 ? ` · exercice actif : ${draft.exercises[Math.min(activeEx, draft.exercises.length - 1)]?.name || "Exercice " + (activeEx + 1)}` : ""}
            </div>
          )}
          {draft.exercises.map((ex, ei) => {
            const dragging = dragEx && dragEx.idx === ei;
            return (
              <React.Fragment key={ei}>
                <div ref={(el) => (cardRefs.current[ei] = el)} onFocusCapture={() => setActiveEx(ei)}
                  className="card-in rounded-xl p-3 mb-3" style={{
                    background: C.surface,
                    border: `1px solid ${chronoActive && ei === Math.min(activeEx, draft.exercises.length - 1) ? C.ember : C.border}`,
                    transform: dragging ? `translateY(${dragEx.dy}px) scale(1.02)` : "none",
                    boxShadow: dragging ? "0 14px 28px rgba(0,0,0,.45)" : "none",
                    position: "relative", zIndex: dragging ? 40 : 1, transition: dragging ? "none" : "transform .15s ease",
                  }}>
                  <div className="flex items-center gap-2 mb-2">
                    <div onPointerDown={onGripDown(ei)} onPointerMove={onGripMove} onPointerUp={onGripUp}
                      className="flex-shrink-0 p-1.5 -ml-1 rounded-lg active:opacity-70"
                      style={{ touchAction: "none", cursor: "grab", background: dragging ? C.surface2 : "transparent" }}>
                      <GripVertical size={16} color={C.muted} />
                    </div>
                    <div className="w-6 h-6 rounded-md flex items-center justify-center flex-shrink-0 font-extrabold text-[11px]"
                      style={{ background: C.ember, color: "#0E1116" }}>
                      {ei + 1}
                    </div>
                    <ExercisePicker value={ex.name} onChange={(v) => updEx(ei, { name: v })} knownExercises={knownExercises} placeholder={`Exercice ${ei + 1} (ex : Tractions)`} />
                    {draft.exercises.length > 1 && <button onClick={() => rmEx(ei)} className="p-2"><Trash2 size={18} color="#F87171" /></button>}
                  </div>
                  {(() => {
                    const lp = lastPerf(ex.name);
                    const isEmpty = ex.sets.every((s) => !s.reps && !s.hold && !s.weight);
                    if (!lp || !isEmpty) return null;
                    return (
                      <button onClick={() => updEx(ei, { sets: lp.sets.map((s) => ({ reps: s.reps || "", hold: s.hold || "", weight: s.weight || "", rpe: s.rpe || "" })) })}
                        className="w-full mb-2 py-1.5 rounded-lg text-[11px] font-semibold flex items-center justify-center gap-1.5 active:scale-95"
                        style={{ background: C.ember + "14", border: `1px solid ${C.ember}55`, color: C.ember }}>
                        <RotateCcw size={12} /> Reprendre la dernière fois ({lp.sets.length} série{lp.sets.length > 1 ? "s" : ""})
                      </button>
                    );
                  })()}
                  {ex.target && <div className="text-[11px] mb-2 px-1 flex items-center gap-1" style={{ color: C.ember }}><Target size={12} /> Objectif : {ex.target}</div>}

                  <div className="flex gap-1.5 mb-2">
                    {Object.entries(EX_KINDS).map(([k, cfg]) => {
                      const active = (ex.kind || "dynamic") === k;
                      return (
                        <button key={k} onClick={() => updEx(ei, { kind: k })}
                          className="flex-1 py-1.5 rounded-lg text-[11px] font-bold active:scale-95"
                          style={{ background: active ? C.ember + "22" : C.surface2, border: `1px solid ${active ? C.ember : C.border}`, color: active ? C.ember : C.muted }}>
                          {cfg.label}
                        </button>
                      );
                    })}
                  </div>
                  {(() => {
                    const fields = EX_KINDS[ex.kind || "dynamic"].fields;
                    const gridCols = `auto repeat(${fields.length}, 1fr) auto`;
                    return (
                      <>
                        <div className="grid gap-2 mb-1 px-1 items-center" style={{ gridTemplateColumns: gridCols }}>
                          <span className="w-6" />
                          {fields.map((f) => <span key={f.key} className="text-[10px] uppercase tracking-wider font-semibold text-center" style={{ color: C.muted }}>{f.label}</span>)}
                          <span />
                        </div>
                        {ex.sets.map((set, si) => (
                          <div key={si} className="mb-2">
                            <div className="grid gap-2 items-center" style={{ gridTemplateColumns: gridCols }}>
                              <span style={{
                                width: 22, height: 22, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                                fontSize: 10, fontWeight: 800, flexShrink: 0,
                                background: C.surface2, border: `1.5px solid ${C.border}`, color: C.muted,
                              }}>{si + 1}</span>
                              {fields.map((f) => f.type === "stepper" ? (
                                <Stepper key={f.key} value={set[f.key]} onChange={(v) => updSet(ei, si, { [f.key]: v })} />
                              ) : (
                                <input key={f.key} inputMode={f.mode} className={inputCls + " font-mono text-center px-1"} style={inputStyle}
                                  value={set[f.key]} onChange={(e) => updSet(ei, si, { [f.key]: e.target.value })} placeholder={f.key === "weight" ? "0" : "—"} />
                              ))}
                              {ex.sets.length > 1 ? <button onClick={() => rmSet(ei, si)} className="p-1"><X size={16} color={C.muted} /></button> : <span className="w-6" />}
                            </div>
                            {(set.time || set.rest) && (
                              <div className="flex gap-2 mt-1 px-1" style={{ marginLeft: 30 }}>
                                {set.time ? <span onClick={() => updSet(ei, si, { time: undefined })} className="inline-flex items-center gap-1 text-[10px] font-bold rounded-full px-2 py-0.5" style={{ color: C.ember, background: C.ember + "18", border: `1px solid ${C.ember}44` }}><Timer size={10} /> {fmtSec(set.time)}</span> : null}
                                {set.rest ? <span onClick={() => updSet(ei, si, { rest: undefined })} className="inline-flex items-center gap-1 text-[10px] font-bold rounded-full px-2 py-0.5" style={{ color: C.sky, background: C.sky + "18", border: `1px solid ${C.sky}44` }}><Pause size={10} /> repos {fmtSec(set.rest)}</span> : null}
                              </div>
                            )}
                          </div>
                        ))}
                      </>
                    );
                  })()}
                  <div className="flex gap-2 mt-1">
                    <button onClick={() => addSet(ei)} className="text-xs font-semibold" style={{ color: C.ember }}>+ série</button>
                    {ex.sets.some((s) => s.reps || s.hold || s.weight) && (
                      <button onClick={() => quickRepeatSet(ei)} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.muted }}>
                        <RotateCcw size={11} /> comme la précédente
                      </button>
                    )}
                  </div>
                </div>
                {ei < draft.exercises.length - 1 && (
                  <button onClick={() => insertExAt(ei + 1)} className="w-full flex items-center gap-2 mb-3 group active:opacity-70" style={{ marginTop: -4 }}>
                    <span style={{ flex: 1, height: 1, background: C.border }} />
                    <span className="flex items-center gap-1 text-[10px] font-bold px-2 py-1 rounded-full" style={{ color: C.muted, border: `1px dashed ${C.border}` }}>
                      <Plus size={10} /> insérer ici
                    </span>
                    <span style={{ flex: 1, height: 1, background: C.border }} />
                  </button>
                )}
              </React.Fragment>
            );
          })}
          <p className="text-[11px] mb-2 px-1" style={{ color: C.muted }}>Reps pour les mouvements dynamiques · Tenue (secondes) pour les isométriques (planche, L-sit, front lever) · Lest si tu ajoutes du poids.</p>
          <Btn kind="ghost" className="w-full mb-4" onClick={addEx}><span className="flex items-center justify-center gap-2"><Plus size={16} /> Ajouter un exercice</span></Btn>
          <Field label={totalChronoSec > 0 ? "Durée totale de l'entraînement" : "Durée totale (min, option.)"}>
            {totalChronoSec > 0 ? (
              <div className="flex items-center gap-2 rounded-xl px-3 py-2.5" style={{ background: C.ember + "12", border: `1px solid ${C.ember}44` }}>
                <Timer size={15} color={C.ember} />
                <span className="font-mono font-bold" style={{ color: C.ember }}>{fmtSec(totalChronoSec)}</span>
                <span className="text-xs" style={{ color: C.muted }}>
                  ({totalChronoMin} min · exercices {fmtSec(totalChronoSec - (parseFloat(draft.warmupSec) || 0))}{draft.warmupSec > 0 ? ` + échauffement ${fmtSec(draft.warmupSec)}` : ""})
                </span>
              </div>
            ) : (
              <input inputMode="numeric" className={inputCls + " font-mono"} style={inputStyle} value={draft.durationMin} onChange={(e) => upd({ durationMin: e.target.value })} placeholder="ex : 45" />
            )}
          </Field>
          </div>
        </>
      )}

      <div style={lockFlowActive && exLocked ? { filter: "blur(3px)", opacity: .4, pointerEvents: "none" } : undefined}>
      <Field label="Intensité (RPE global 1-10)"><input inputMode="numeric" className={inputCls + " font-mono"} style={inputStyle} value={draft.rpe} onChange={(e) => upd({ rpe: e.target.value })} placeholder="1-10" /></Field>
      <Field label="Ressenti">
        <div className="flex gap-2">
          {["💀", "😮‍💨", "🦦"].map((f) => (
            <button key={f} onClick={() => upd({ feeling: f })} className="flex-1 py-2 rounded-lg text-xl"
              style={{ background: draft.feeling === f ? C.ember + "33" : C.surface2, border: `1px solid ${draft.feeling === f ? C.ember : C.border}` }}>{f}</button>
          ))}
        </div>
      </Field>
      <Field label="Partenaires d'entraînement">
        <div className="flex gap-2 mb-2">
          <input className={inputCls} style={inputStyle} value={partnerInput}
            onChange={(e) => setPartnerInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addPartner(partnerInput); } }}
            placeholder="Ajouter un nouveau partenaire…" />
          <Btn kind="ghost" onClick={() => addPartner(partnerInput)}><UserPlus size={16} /></Btn>
        </div>
        {Array.from(new Set([...partners, ...knownPartners])).length > 0 && (
          <div className="flex flex-wrap gap-2">
            {Array.from(new Set([...partners, ...knownPartners])).map((k) => {
              const on = partners.includes(k);
              return (
                <button key={k} onClick={() => (on ? rmPartner(k) : addPartner(k))}
                  className="flex items-center gap-1.5 pl-2.5 pr-3 py-1.5 rounded-full text-sm active:scale-95"
                  style={{ background: on ? C.sky + "22" : "transparent", border: `1px solid ${on ? C.sky : C.border}`, color: on ? C.sky : C.muted }}>
                  <Users size={13} color={on ? C.sky : C.muted} /> {k}
                  {on && <X size={13} color={C.sky} className="ml-0.5" />}
                </button>
              );
            })}
          </div>
        )}
      </Field>
      <Field label="Notes"><textarea className={inputCls} style={{ ...inputStyle, minHeight: 80 }} value={draft.notes} onChange={(e) => upd({ notes: e.target.value })} placeholder={run ? "Terrain, sensations, genou…" : "Variations, tenue, ressenti du genou…"} /></Field>
      </div>
      </>
      )}
    </Overlay>
  );
}

        <span className="flex items-center gap-1">{isRun(session) ? <RunIcon size={14} /> : <CalisIcon size={14} />} {fmtDate(session.date)}</span>
        {session.durationMin && <span className="flex items-center gap-1"><Timer size={14} /> {session.durationMin} min</span>}
        {session.feeling && (

          <Stat label="Allure" value={fmtPace(runPace(session))} color={C.sky} />

        <div className="grid grid-cols-3 gap-3 mb-4">
          <Stat label="Répétitions" value={sessionReps(session)} color={C.ember} />

          Sortie {session.runKind || "continu"}

      ) : (session.exercises || []).map((ex, i) => (
        <div key={i} className="rounded-xl p-3 mb-2" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <div className="font-semibold mb-2">{ex.name || `Exercice ${i + 1}`}</div>
          <div className="flex flex-wrap gap-2">
            {(ex.sets || []).map((s, si) => {
              const parts = [];
              if (s.reps) parts.push(`${s.reps} reps`);

                <span key={si} className="font-mono text-xs px-2 py-1 rounded" style={{ background: C.surface2, color: C.text }}>
                  {parts.join(" · ") || "—"}{s.rpe ? ` @${s.rpe}` : ""}
                </span>
              );
            })}
          </div>

        <div className="rounded-xl p-3 mt-3" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <div className="text-[10px] uppercase tracking-widest font-semibold mb-2" style={{ color: C.muted }}>Partenaires</div>
          <div className="flex flex-wrap gap-2">
            {session.partners.map((p) => (
              <span key={p} className="flex items-center gap-1.5 text-sm px-2.5 py-1 rounded-full" style={{ background: C.surface2 }}>
                <Users size={13} color={C.sky} /> {p}
              </span>
            ))}
          </div>
        </div>

      {session.notes && <div className="rounded-xl p-3 mt-3 text-sm" style={{ background: C.surface, border: `1px solid ${C.border}`, color: C.text }}>{session.notes}</div>}
      <div className="flex gap-3 mt-6">
        <Btn kind="ghost" className="flex-1" onClick={onDuplicate}><span className="flex items-center justify-center gap-1.5"><Copy size={15} /> Dupliquer</span></Btn>
        <Btn kind="ghost" className="flex-1" onClick={onEdit}>Modifier</Btn>
        <Btn kind="danger" onClick={onDelete}><Trash2 size={16} /></Btn>
      </div>

  );

/* ---------- PROGRESSION ---------- */
function ProgressView({ sessions, target }) {
  const weekly = useMemo(() => {
    const map = {};
    sessions.forEach((s) => {
      const k = isoWeekKey(s.date);
      if (!map[k]) map[k] = { count: 0, km: 0 };
      map[k].count++;
      if (isRun(s)) map[k].km += parseFloat(s.distanceKm) || 0;
    });
    const keys = [];
    for (let b = 7; b >= 0; b--) keys.push(prevWeekKey(currentWeekKey(), b));
    return keys.map((k) => ({ week: k.split("-S")[1], séances: map[k]?.count || 0, km: Math.round((map[k]?.km || 0) * 10) / 10 }));
  }, [sessions]);

  const runPaceData = useMemo(() => sessions.filter((s) => isRun(s) && runPace(s))
    .sort((a, b) => a.date.localeCompare(b.date))
    .map((s) => ({ date: fmtDate(s.date), allure: Math.round(runPace(s) * 100) / 100 })), [sessions]);

  const exNames = useMemo(() => {
    const set = new Set();
    sessions.forEach((s) => !isRun(s) && (s.exercises || []).forEach((e) => e.name && set.add(e.name.trim())));
    return [...set];
  }, [sessions]);
  const [sel, setSel] = useState("");
  useEffect(() => { if (!sel && exNames.length) setSel(exNames[0]); }, [exNames, sel]);

  const exData = useMemo(() => {
    if (!sel) return [];
    return sessions.filter((s) => !isRun(s) && s.date).sort((a, b) => a.date.localeCompare(b.date)).map((s) => {
      let bestReps = 0, bestHold = 0;
      (s.exercises || []).forEach((e) => { if ((e.name || "").trim() === sel) (e.sets || []).forEach((st) => {
        const r = parseInt(st.reps) || 0, h = parseInt(st.hold) || 0;
        if (r > bestReps) bestReps = r; if (h > bestHold) bestHold = h;
      }); });
      if (bestReps === 0 && bestHold === 0) return null;
      return { date: fmtDate(s.date), reps: bestReps || null, tenue: bestHold || null };
    }).filter(Boolean);
  }, [sessions, sel]);
  const usesHold = exData.some((d) => d.tenue);

  const kpis = useMemo(() => {
    const wc = {};
    sessions.forEach((s) => { const k = isoWeekKey(s.date); wc[k] = (wc[k] || 0) + 1; });
    let last4 = 0; for (let b = 0; b < 4; b++) last4 += wc[prevWeekKey(currentWeekKey(), b)] || 0;
    const now = new Date();
    const mk = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    const ms = sessions.filter((s) => (s.date || "").startsWith(mk));
    const monthKm = ms.filter(isRun).reduce((a, s) => a + (parseFloat(s.distanceKm) || 0), 0);
    const monthReps = ms.filter((s) => !isRun(s)).reduce((a, s) => a + sessionReps(s), 0);
    const wCount = sessions.filter((s) => !isRun(s)).length;
    const rCount = sessions.filter(isRun).length;
    const paces = sessions.filter((s) => isRun(s) && runPace(s)).map((s) => runPace(s));
    const avgPace = paces.length ? paces.reduce((a, b) => a + b, 0) / paces.length : null;
    return { monthCount: ms.length, monthKm: Math.round(monthKm * 10) / 10, monthReps, avgWeek: Math.round((last4 / 4) * 10) / 10, wCount, rCount, total: wCount + rCount, avgPace };
  }, [sessions]);

  const [diFilter, setDiFilter] = useState("all"); // all | workout | run
  const diSessions = useMemo(() => sessions
    .filter((s) => (diFilter === "all" ? true : diFilter === "workout" ? !isRun(s) : isRun(s)))
    .filter((s) => s.durationMin || s.rpe)
    .sort((a, b) => a.date.localeCompare(b.date)), [sessions, diFilter]);
  const diData = diSessions.map((s) => ({ date: fmtDate(s.date), durée: parseFloat(s.durationMin) || null, rpe: parseFloat(s.rpe) || null, run: isRun(s) }));
  const diStats = useMemo(() => {
    const durs = diSessions.map((s) => parseFloat(s.durationMin)).filter((v) => v > 0);
    const rpes = diSessions.map((s) => parseFloat(s.rpe)).filter((v) => v > 0);
    const avg = (arr) => (arr.length ? Math.round((arr.reduce((a, b) => a + b, 0) / arr.length) * 10) / 10 : null);
    const wDurs = sessions.filter((s) => !isRun(s) && s.durationMin).map((s) => parseFloat(s.durationMin));
    const rDurs = sessions.filter((s) => isRun(s) && s.durationMin).map((s) => parseFloat(s.durationMin));
    return {
      avgDur: avg(durs), minDur: durs.length ? Math.min(...durs) : null, maxDur: durs.length ? Math.max(...durs) : null,
      avgRpe: avg(rpes), minRpe: rpes.length ? Math.min(...rpes) : null, maxRpe: rpes.length ? Math.max(...rpes) : null,
      avgDurWorkout: avg(wDurs), avgDurRun: avg(rDurs),
    };
  }, [diSessions, sessions]);

  if (sessions.length === 0) return <EmptyState text="Ajoute des séances pour voir tes courbes de progression apparaître ici." />;

  return (
    <div>
      <h2 className="text-lg font-bold mb-3">Progression</h2>

      <div className="grid grid-cols-3 gap-3 mb-3">
        <Stat label="Ce mois" value={kpis.monthCount} sub="séances" />
        <Stat label="Moy. / sem." value={kpis.avgWeek} sub="4 dern. sem." color={C.ember} />
        <Stat label="Allure moy." value={kpis.avgPace ? fmtPace(kpis.avgPace).replace("/km", "") : "—"} sub="min/km" color={C.sky} />
      </div>

      <div className="rounded-xl p-3 mb-4" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex items-center justify-between text-xs mb-2" style={{ color: C.muted }}>
          <span>Répartition callisthénie / course</span><span>{kpis.total} séances</span>
        </div>
        <div className="flex h-2.5 rounded-full overflow-hidden" style={{ background: C.bg }}>
          <div className="bar-fill" style={{ width: `${kpis.total ? (kpis.wCount / kpis.total) * 100 : 0}%`, background: C.ember }} />
          <div className="bar-fill" style={{ width: `${kpis.total ? (kpis.rCount / kpis.total) * 100 : 0}%`, background: C.sky }} />
        </div>
        <div className="flex justify-between text-[11px] mt-1.5">
          <span style={{ color: C.ember }}>{kpis.wCount} callisthénie</span>
          <span style={{ color: C.sky }}>{kpis.rCount} course</span>
        </div>
        <div className="text-[11px] mt-2 pt-2" style={{ color: C.muted, borderTop: `1px solid ${C.border}` }}>Ce mois-ci : {kpis.monthReps.toLocaleString("fr-FR")} reps · {kpis.monthKm} km</div>
      </div>
      <ChartCard title="Durée & intensité des séances" sub="comparer la durée (min) et le RPE dans le temps">
        <div className="flex gap-2 mb-3">
          {[["all", "Tout"], ["workout", "Callisthénie"], ["run", "Course"]].map(([id, lbl]) => (
            <button key={id} onClick={() => setDiFilter(id)} className="px-3 py-1.5 rounded-full text-xs font-semibold"
              style={{ background: diFilter === id ? C.ember + "22" : C.surface2, border: `1px solid ${diFilter === id ? C.ember : C.border}`, color: diFilter === id ? C.ember : C.muted }}>{lbl}</button>
          ))}
        </div>

        <div className="grid grid-cols-3 gap-2 mb-3">
          <div className="rounded-lg px-2.5 py-2" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
            <div className="text-[9px] uppercase tracking-wider" style={{ color: C.muted }}>Durée moy.</div>
            <div className="font-mono font-bold text-sm" style={{ color: C.ember }}>{diStats.avgDur ?? "—"} min</div>
          </div>
          <div className="rounded-lg px-2.5 py-2" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
            <div className="text-[9px] uppercase tracking-wider" style={{ color: C.muted }}>Min · Max</div>
            <div className="font-mono font-bold text-sm" style={{ color: C.text }}>{diStats.minDur ?? "—"}–{diStats.maxDur ?? "—"}</div>
          </div>
          <div className="rounded-lg px-2.5 py-2" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
            <div className="text-[9px] uppercase tracking-wider" style={{ color: C.muted }}>RPE moy.</div>
            <div className="font-mono font-bold text-sm" style={{ color: C.sky }}>{diStats.avgRpe ?? "—"} /10</div>
          </div>
        </div>

        {(diStats.avgDurWorkout || diStats.avgDurRun) && (
          <div className="text-[11px] mb-3 flex items-center gap-3" style={{ color: C.muted }}>
            {diStats.avgDurWorkout && <span><span style={{ color: C.ember }}>●</span> callisthénie ≈ {diStats.avgDurWorkout} min</span>}
            {diStats.avgDurRun && <span><span style={{ color: C.sky }}>●</span> course ≈ {diStats.avgDurRun} min</span>}
          </div>
        )}

        {diData.length > 0 ? (
          <ResponsiveContainer width="100%" height={200}>
            <ComposedChart data={diData}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false} />
              <XAxis dataKey="date" tick={{ fill: C.muted, fontSize: 10 }} />
              <YAxis yAxisId="l" tick={{ fill: C.muted, fontSize: 11 }} />
              <YAxis yAxisId="r" orientation="right" domain={[0, 10]} tick={{ fill: C.muted, fontSize: 11 }} />
              <Tooltip contentStyle={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text }} />
              <Bar yAxisId="l" dataKey="durée" name="Durée (min)" fill={C.ember} radius={[4, 4, 0, 0]} />
              <Line yAxisId="r" type="monotone" dataKey="rpe" name="RPE" stroke={C.sky} strokeWidth={2.5} dot={{ r: 3, fill: C.sky }} connectNulls />
            </ComposedChart>
          </ResponsiveContainer>
        ) : <p className="text-sm text-center py-6" style={{ color: C.muted }}>Renseigne une durée ou un RPE sur tes séances pour les comparer ici.</p>}
      </ChartCard>

      <ChartCard title="Séances par semaine" sub={`objectif : ${target}/sem.`}>
        <ResponsiveContainer width="100%" height={180}>
          <BarChart data={weekly}>
            <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false} />
            <XAxis dataKey="week" tick={{ fill: C.muted, fontSize: 11 }} />

function PlanningView({ plan, setPlan, programs, sessions, onStartProgram, onDetail }) {

    if (!item) return null;
    if (item.kind === "rest") return "Repos";
    if (item.kind === "run") return "Course";
    if (item.kind === "program") { const p = programs.find((pp) => pp.id === item.programId); return p ? p.name : (item.label || "Programme"); }
    return item.label || null;
  };
  const colorFor = (item) => item?.kind === "run" ? C.sky : item?.kind === "rest" ? C.muted : C.ember;
  const iconFor = (item) => item?.kind === "run" ? RunIcon : item?.kind === "rest" ? Coffee : CalisIcon;

  const renderWeek = (title, slice) => (
    <div className="mb-5">
      <div className="text-[11px] uppercase tracking-widest font-semibold mb-2" style={{ color: C.muted }}>{title}</div>
      <div className="space-y-2">
        {slice.map((date) => {
          const item = plan[date];
          const logged = sessions.filter((s) => s.date === date);
          const isToday = date === today;
          const Ic = iconFor(item);
          const prog = item?.kind === "program" ? programs.find((pp) => pp.id === item.programId) : null;
          return (
            <div key={date} className="rounded-xl p-3 flex items-center gap-3" style={{
              background: logged.length > 0 ? `linear-gradient(135deg, ${C.green}16, ${C.surface})` : C.surface,

              boxShadow: logged.length > 0 ? `0 0 0 1px ${C.green}22` : "none",
            }}>
              <div className="w-10 text-center flex-shrink-0">
                <div className="text-[10px] uppercase font-semibold" style={{ color: isToday ? C.ember : C.muted }}>{weekdayShort(date)}</div>
                <div className="font-mono font-bold text-lg leading-none" style={{ color: isToday ? C.ember : C.text }}>{dayNum(date)}</div>
              </div>
              <button onClick={() => setAssignDate(date)} className="flex-1 text-left min-w-0">
                {item
                  ? <span className="inline-flex items-center gap-1.5 text-sm font-semibold" style={{ color: colorFor(item) }}><Ic size={15} /> <span className="truncate">{labelFor(item)}</span></span>
                  : <span className="text-sm" style={{ color: C.muted }}>+ Planifier</span>}
                {logged.length > 0 && (
                  <div className="node-shine inline-flex items-center gap-1 mt-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold" style={{ background: C.green, color: "#0E1116" }}>
                    <Check size={12} strokeWidth={3} /> {logged.length > 1 ? `${logged.length} séances faites` : "Séance faite"}
                  </div>
                )}
              </button>
              {prog && <button onClick={() => onStartProgram(prog, date)} className="px-2.5 py-1.5 rounded-lg text-xs font-bold flex-shrink-0" style={{ background: C.ember, color: "#0E1116" }}>Démarrer</button>}
              {logged.length > 0 && !item && <button onClick={() => onDetail(logged[0])} className="p-1 flex-shrink-0"><ChevronRight size={18} color={C.muted} /></button>}

function GoalsView({ goals, setGoals, onAdd }) {
  const toggle = (id) => {
    const g = goals.find((x) => x.id === id);
    if (g && !g.done && typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate([25, 40, 25]);
    setGoals(goals.map((x) => x.id === id ? { ...x, done: !x.done } : x));
  };
  const del = (id) => setGoals(goals.filter((g) => g.id !== id));
  const bump = (id, v) => setGoals(goals.map((g) => g.id === id ? { ...g, current: Math.max(0, (parseFloat(g.current) || 0) + v) } : g));
  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <h2 className="text-lg font-bold">Objectifs</h2>
        <Btn onClick={onAdd}><span className="flex items-center gap-1"><Plus size={16} /> Ajouter</span></Btn>
      </div>
      {goals.length === 0 ? <EmptyState text="Fixe-toi un objectif clair et mesurable." action="Créer un objectif" onAction={onAdd} />
        : <div className="space-y-3">{goals.map((g) => {
          const pct = g.target ? Math.min(100, Math.round(((parseFloat(g.current) || 0) / parseFloat(g.target)) * 100)) : 0;
          return (
            <div key={g.id} className="rounded-xl p-4" style={{ background: C.surface, border: `1px solid ${C.border}`, opacity: g.done ? 0.55 : 1 }}>
              <div className="flex items-start justify-between gap-2">
                <div className="flex-1">
                  <div className={`font-semibold ${g.done ? "line-through" : ""}`}>{g.title}</div>
                  <div className="text-xs mt-0.5" style={{ color: C.muted }}>
                    <span className="font-mono">{g.current || 0}</span> / {g.target} {g.unit}{g.deadline ? ` · échéance ${fmtDate(g.deadline)}` : ""}
                  </div>
                </div>
                <button onClick={() => toggle(g.id)} className="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0"
                  style={{ background: g.done ? C.green : "transparent", border: `1px solid ${g.done ? C.green : C.border}` }}>
                  {g.done && <Check size={16} color="#0E1116" />}
                </button>
              </div>
              {!g.done && <>
                <div className="mt-3 h-2 rounded-full overflow-hidden" style={{ background: C.bg }}>
                  <div className="h-full rounded-full bar-fill" style={{ width: `${pct}%`, background: C.ember }} />
                </div>
                <div className="flex items-center gap-2 mt-3">
                  <button onClick={() => bump(g.id, -1)} className="px-3 py-1 rounded-lg font-mono text-sm" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>−1</button>
                  <button onClick={() => bump(g.id, 1)} className="px-3 py-1 rounded-lg font-mono text-sm" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>+1</button>
                  <button onClick={() => del(g.id)} className="ml-auto p-1"><Trash2 size={16} color="#F87171" /></button>
                </div>
              </>}
            </div>
          );
        })}</div>}
    </div>
  );
}

      tKcal: a.tKcal + kt, tP: a.tP + mt.protein, tC: a.tC + mt.carbs, tF: a.tF + mt.fat, logged: a.logged + (t.hasData ? 1 : 0) };
  }, { kcal: 0, protein: 0, carbs: 0, fat: 0, tKcal: 0, tP: 0, tC: 0, tF: 0, logged: 0 });

  todayMeals.forEach((m) => { const a = periodAgg[mealPeriod(m)]; a.kcal += m.kcal || 0; a.protein += m.protein || 0; a.carbs += m.carbs || 0; a.fat += m.fat || 0; });
  const todaySupp = supplements[today] || {};

function ProgramBuilder({ initial, onSave, onCancel, sessions = [] }) {
  const [p, setP] = useState(() => initial
    ? { ...initial, guide: initial.guide || [], exercises: (initial.exercises && initial.exercises.length ? initial.exercises : [{ name: "", kind: "dynamic", targetSets: "", targetReps: "" }]) }
    : { id: uid(), name: "", focus: "", notes: "", guide: [], exercises: [{ name: "", kind: "dynamic", targetSets: "", targetReps: "" }] });
  const addSection = () => setP((prev) => ({ ...prev, guide: [...(prev.guide || []), { id: uid(), title: "", body: "" }] }));
  const updSection = (i, patch) => setP((prev) => { const g = [...(prev.guide || [])]; g[i] = { ...g[i], ...patch }; return { ...prev, guide: g }; });
  const rmSection = (i) => setP((prev) => ({ ...prev, guide: (prev.guide || []).filter((_, x) => x !== i) }));
  const moveSection = (from, to) => setP((prev) => { const g = [...(prev.guide || [])]; if (to < 0 || to >= g.length) return prev; const [it] = g.splice(from, 1); g.splice(to, 0, it); return { ...prev, guide: g }; });
  const updEx = (i, patch) => { const ex = [...p.exercises]; ex[i] = { ...ex[i], ...patch }; setP({ ...p, exercises: ex }); };
  const addEx = () => setP({ ...p, exercises: [...p.exercises, { name: "", kind: "dynamic", targetSets: "", targetReps: "" }] });
  const insertExAt = (idx) => { const ex = [...p.exercises]; ex.splice(idx, 0, { name: "", kind: "dynamic", targetSets: "", targetReps: "" }); setP({ ...p, exercises: ex }); };
  const rmEx = (i) => setP({ ...p, exercises: p.exercises.filter((_, x) => x !== i) });
  const moveEx = (from, to) => {
    if (to < 0 || to >= p.exercises.length || from === to) return;
    const ex = [...p.exercises]; const [item] = ex.splice(from, 1); ex.splice(to, 0, item);
    setP({ ...p, exercises: ex });
  };

  const workoutSessions = sessions.filter((s) => !isRun(s) && Array.isArray(s.exercises));
  const knownExercises = Array.from(new Set([
    ...workoutSessions.flatMap((s) => s.exercises.map((e) => (e.name || "").trim()).filter(Boolean)),
    ...p.exercises.map((e) => (e.name || "").trim()).filter(Boolean),
  ])).sort((a, b) => a.localeCompare(b));

  const cardRefs = useRef([]);
  const [dragEx, setDragEx] = useState(null);
  const onGripDown = (ei) => (e) => { e.preventDefault(); e.currentTarget.setPointerCapture(e.pointerId); setDragEx({ idx: ei, startY: e.clientY, dy: 0 }); };
  const onGripMove = (e) => { if (!dragEx) return; setDragEx((d) => (d ? { ...d, dy: e.clientY - d.startY } : d)); };
  const onGripUp = () => {
    if (!dragEx) return;
    const draggedRect = cardRefs.current[dragEx.idx]?.getBoundingClientRect();
    if (draggedRect) {
      const draggedCenterY = draggedRect.top + draggedRect.height / 2 + dragEx.dy;
      const others = p.exercises.map((_, i) => i).filter((i) => i !== dragEx.idx);
      let insertPos = others.length;
      for (let k = 0; k < others.length; k++) {
        const r = cardRefs.current[others[k]]?.getBoundingClientRect();
        if (r && draggedCenterY < r.top + r.height / 2) { insertPos = k; break; }
      }
      if (insertPos !== dragEx.idx) { moveEx(dragEx.idx, insertPos); if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(12); }
    }
    setDragEx(null);
  };

  return (
    <Overlay title={initial ? "Modifier le programme" : "Nouveau programme"} onBack={onCancel}
      footer={
        <div>
          <Btn className="w-full" onClick={() => onSave(p)} disabled={!p.name}>Enregistrer le programme</Btn>
          {!p.name && <p className="text-[11px] text-center mt-2" style={{ color: C.muted }}>Donne un nom au programme pour pouvoir l'enregistrer.</p>}
        </div>
      }>
      <Field label="Nom"><input className={inputCls} style={inputStyle} value={p.name} onChange={(e) => setP({ ...p, name: e.target.value })} placeholder="Ex : Full body A" /></Field>
      <Field label="Focus (option.)"><input className={inputCls} style={inputStyle} value={p.focus} onChange={(e) => setP({ ...p, focus: e.target.value })} placeholder="Force / hypertrophie / endurance…" /></Field>
      <div className="text-[11px] uppercase tracking-wider font-semibold mb-2 mt-1" style={{ color: C.muted }}>Exercices</div>

      {p.exercises.map((ex, i) => {
        const kind = ex.kind || "dynamic";
        const dragging = dragEx && dragEx.idx === i;
        return (
          <React.Fragment key={i}>
            <div ref={(el) => (cardRefs.current[i] = el)} className="card-in rounded-xl p-3 mb-2"
              style={{
                background: C.surface, border: `1px solid ${C.border}`,
                transform: dragging ? `translateY(${dragEx.dy}px) scale(1.02)` : "none",
                boxShadow: dragging ? "0 14px 28px rgba(0,0,0,.45)" : "none",
                position: "relative", zIndex: dragging ? 40 : 1, transition: dragging ? "none" : "transform .15s ease",
              }}>
              <div className="flex items-center gap-2 mb-2">
                <div onPointerDown={onGripDown(i)} onPointerMove={onGripMove} onPointerUp={onGripUp}
                  className="flex-shrink-0 p-1.5 -ml-1 rounded-lg active:opacity-70"
                  style={{ touchAction: "none", cursor: "grab", background: dragging ? C.surface2 : "transparent" }}>
                  <GripVertical size={16} color={C.muted} />
                </div>
                <ExercisePicker value={ex.name} onChange={(v) => updEx(i, { name: v })} knownExercises={knownExercises} placeholder={`Exercice ${i + 1}`} />
                {p.exercises.length > 1 && <button onClick={() => rmEx(i)} className="p-2"><Trash2 size={18} color="#F87171" /></button>}
              </div>

              <div className="flex gap-1.5 mb-2">
                {Object.entries(EX_KINDS).map(([k, cfg]) => {
                  const active = kind === k;
                  return (
                    <button key={k} onClick={() => updEx(i, { kind: k })}
                      className="flex-1 py-1.5 rounded-lg text-[11px] font-bold active:scale-95"
                      style={{ background: active ? C.ember + "22" : C.surface2, border: `1px solid ${active ? C.ember : C.border}`, color: active ? C.ember : C.muted }}>
                      {cfg.label}
                    </button>
                  );
                })}
              </div>

              <div className="grid gap-2 items-center" style={{ gridTemplateColumns: kind === "weighted" ? "1fr 1fr 1fr" : "1fr 1fr" }}>
                <div>
                  <div className="text-[9px] uppercase tracking-wider font-semibold mb-1" style={{ color: C.muted }}>Séries</div>
                  <input inputMode="numeric" className={inputCls + " font-mono text-center"} style={inputStyle} value={ex.targetSets} onChange={(e) => updEx(i, { targetSets: e.target.value })} placeholder="3" />
                </div>
                <div>
