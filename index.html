const hasStore = () => typeof window !== "undefined" && window.storage;
async function loadKey(k, fb) {
  if (!hasStore()) return fb;
  try {
    const r = await window.storage.get(k);
    if (r && r.value != null) return JSON.parse(r.value);
    return fb;
  } catch { return fb; }
}
// Interrupteur global : les écritures restent BLOQUÉES tant qu'un chargement propre
// n'a pas été confirmé, pour ne jamais écraser des données existantes par du vide.
let WRITES_ENABLED = false;
async function saveKey(k, v) {
  if (!WRITES_ENABLED) return false;
  if (!hasStore()) { console.warn("saveKey: window.storage indisponible", k); return false; }
  const payload = JSON.stringify(v);
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      await window.storage.set(k, payload);
      // écriture vérifiée : on relit pour confirmer que ça a bien été enregistré
      try { const r = await window.storage.get(k); if (r && r.value === payload) return true; } catch (e) { /* vérif échouée -> on retente */ }
    } catch (e) { console.error("save", k, e); }
  }
  return false;
}
async function deleteKey(k) {
  if (!WRITES_ENABLED || !hasStore()) return;
  try { await window.storage.delete(k); } catch (e) { /* déjà absent */ }
}

/* ---------- utilitaires ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => new Date().toISOString().slice(0, 10);
function isoWeekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  return `${t.getUTCFullYear()}-S${String(week).padStart(2, "0")}`;
}
function currentWeekKey() { return isoWeekKey(todayISO()); }
function prevWeekKey(key, back) {
  const d = new Date();
  d.setDate(d.getDate() - back * 7);
  return isoWeekKey(d.toISOString().slice(0, 10));
}
function sessionVolume(s) {
  let v = 0;
  (s.exercises || []).forEach((e) => (e.sets || []).forEach((set) => {
    const r = parseFloat(set.reps) || 0, w = parseFloat(set.weight) || 0;
    v += r * w;
  }));
  return Math.round(v);
}
function sessionReps(s) {
  let r = 0;
  (s.exercises || []).forEach((e) => (e.sets || []).forEach((set) => { r += parseInt(set.reps) || 0; }));
  return r;
}
const isRun = (s) => s.type === "run";
function runPace(s) { // minutes par km
  const d = parseFloat(s.distanceKm) || 0, t = parseFloat(s.durationMin) || 0;
  if (!d || !t) return null;
  return t / d;
}
function fmtPace(p) {
  if (p == null) return "—";
  const m = Math.floor(p), sec = Math.round((p - m) * 60);
  return `${m}:${String(sec).padStart(2, "0")}/km`;
}
function draftHasContent(d) {
  if (!d) return false;
  if (isRun(d)) return !!(d.distanceKm || d.durationMin || (d.name && d.name.trim()) || (d.notes && d.notes.trim()));
  const exFilled = (d.exercises || []).some((e) => (e.name && e.name.trim()) || (e.sets || []).some((s) => s.reps || s.hold || s.weight || s.rpe || s.time || s.rest));
  return exFilled || !!d.warmupSec || !!d.extraRestSec || (d.name && d.name.trim()) || (d.notes && d.notes.trim());
}
const fmtDate = (iso) => {
  try { return new Date(iso + "T00:00:00").toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }); }
  catch { return iso; }
};
const toISO = (d) => { const x = new Date(d); x.setHours(12, 0, 0, 0); return x.toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return toISO(d); };
const addMonths = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setMonth(d.getMonth() + n); return toISO(d); };
function mondayOfCurrentWeek() {
  const d = new Date(); const day = d.getDay() || 7; // 1=lundi … 7=dimanche
  d.setDate(d.getDate() - (day - 1)); d.setHours(12, 0, 0, 0); return d;
}
function twoWeekDays() {
  const start = mondayOfCurrentWeek();
  return Array.from({ length: 14 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return toISO(d); });
}
function weekDaysAt(offset) {
  const start = mondayOfCurrentWeek();
  start.setDate(start.getDate() + offset * 7);
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return toISO(d); });
}
function weekLabelFor(offset) {
  if (offset === 0) return "Cette semaine";
  if (offset === 1) return "Semaine prochaine";
  if (offset === -1) return "Semaine dernière";
  if (offset > 1) return `Dans ${offset} semaines`;
  return `Il y a ${Math.abs(offset)} semaines`;
}
const WD = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
const WD_FULL = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];

function daySummary(sessions, date, plan) {
  const list = sessions.filter((s) => s.date === date);
  if (list.length === 0) {
    const p = (plan || {})[date];
    if (p && (p.kind === "run" || p.kind === "program")) return { status: "planned", label: p.label || (p.kind === "run" ? "Course" : "Programme") };
    return { status: "rest" };
  }
  const totalDuration = list.reduce((a, s) => a + (parseFloat(s.durationMin) || 0), 0);
  const totalReps = list.reduce((a, s) => a + sessionReps(s), 0);
  const totalKm = list.reduce((a, s) => a + (parseFloat(s.distanceKm) || 0), 0);
  const rpeVals = list.map((s) => parseFloat(s.rpe)).filter((v) => !isNaN(v));
  const avgRpe = rpeVals.length ? Math.round((rpeVals.reduce((a, b) => a + b, 0) / rpeVals.length) * 10) / 10 : null;
  const allRun = list.every(isRun);
  const label = list.length === 1 ? (list[0].name || (allRun ? "Course" : "Callisthénie")) : `${list.length} séances`;
  return { status: "done", label, duration: totalDuration || null, reps: totalReps || null, rpe: avgRpe, isRun: allRun, distanceKm: allRun ? (totalKm || null) : null };
}

async function aiLookupIngredient(name) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 320,
        messages: [{ role: "user", content:
          `Tu es une base de données nutritionnelle. Pour l'aliment "${name}", donne les valeurs pour 100 g (ou 100 ml si c'est un liquide), tel que couramment consommé en France.\n` +
          `Réponds UNIQUEMENT avec un objet JSON strict, sans texte autour ni balises markdown, au format exact :\n` +
          `{"name": "nom normalisé et précis en français", "kcal": nombre, "protein": nombre, "carbs": nombre, "fat": nombre, "basis": "100 g" ou "100 ml", "assumption": "courte hypothèse retenue (cuit/cru, marque générique, etc.)", "confidence": "haute"|"moyenne"|"basse"}\n` +
          `Sois précis : si le nom est ambigu, choisis l'interprétation la plus courante et explique-la dans "assumption". Les nombres sont numériques, sans unité.` }],
      }),
    });
    const data = await res.json();
    const text = (data.content || []).map((b) => b.text || "").join("").replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(text);
    if (typeof parsed.kcal !== "number") return null;
    return {
      name: (parsed.name && String(parsed.name).trim()) || name,
      kcal: Math.round(parsed.kcal),
      protein: Math.round(parsed.protein || 0),
      carbs: Math.round(parsed.carbs || 0),
      fat: Math.round(parsed.fat || 0),
      source: "ai",
      basis: parsed.basis || "100 g",
      assumption: parsed.assumption || "",
      confidence: parsed.confidence || "moyenne",
    };
  } catch (e) {
    return null;
  }
}

function macrosToKcal(protein, carbs, fat) {
  return Math.round((parseFloat(protein)||0)*4+(parseFloat(carbs)||0)*4+(parseFloat(fat)||0)*9);
}
function bmr(weightKg, heightCm, age, sex) {
  const w=parseFloat(weightKg)||0,h=parseFloat(heightCm)||0,a=parseFloat(age)||0;
  if(!w||!h||!a) return null;
  return sex==="f"?10*w+6.25*h-5*a-161:10*w+6.25*h-5*a+5;
}
const ACTIVITY_MULT={sedentary:1.2,light:1.375,moderate:1.55,active:1.725};
function computeCalorieTarget(nutriProfile,isTrainingDay){
  const base=bmr(nutriProfile.weightKg,nutriProfile.heightCm,nutriProfile.age,nutriProfile.sex);
  if(!base)return null;
  const mult=ACTIVITY_MULT[nutriProfile.activity||"moderate"];
  let tdee=base*mult;
  if(isTrainingDay)tdee+=150;
  const goalPct=parseFloat(nutriProfile.goalPct);
  const pct=isNaN(goalPct)?0:goalPct;
  return Math.round(tdee*(1+pct/100));
}
function computeMacroTargets(nutriProfile,kcalTarget){
  if(!kcalTarget)return null;
  const w=parseFloat(nutriProfile.weightKg)||0;
  const perKg=parseFloat(nutriProfile.proteinPerKg);
  const fatPctRaw=parseFloat(nutriProfile.fatPct);
  const fatPct=isNaN(fatPctRaw)?30:fatPctRaw;
  const proteinG=w?Math.round(w*(isNaN(perKg)?1.8:perKg)):Math.round((kcalTarget*0.25)/4);
  const fatG=Math.round((kcalTarget*(fatPct/100))/9);
  const carbsG=Math.max(0,Math.round((kcalTarget-proteinG*4-fatG*9)/4));
  return{protein:proteinG,carbs:carbsG,fat:fatG};
}

function mealPeriod(m){

}
function unitById(id){

}

const FOOD_DB_VERSION = 5;
function foodDbLookup(name) {
  const q = (name || "").trim().toLowerCase();
  const hit = FOOD_DB.find((f) => f[0].toLowerCase() === q || f[0].toLowerCase().startsWith(q) || q.startsWith(f[0].toLowerCase().slice(0, 5)));
  return hit ? { name: hit[0], kcal: hit[1], protein: hit[2], carbs: hit[3], fat: hit[4], source: "db" } : null;
}
function foodDbLookupExact(name) {
  const q = (name || "").trim().toLowerCase();
  const hit = FOOD_DB.find((f) => f[0].toLowerCase() === q);
  return hit ? { name: hit[0], kcal: hit[1], protein: hit[2], carbs: hit[3], fat: hit[4], source: "db" } : null;
}
function itemGramsEq(it) {
  const qty = parseFloat(it.qty) || 0;
  if (!it.unit || it.unit === "g") return qty;
  if (it.unit === "kg") return qty * 1000;
  if (it.unit === "ml" || it.unit === "cl") return it.unit === "cl" ? qty * 10 : qty;
  if (it.unit === "l") return qty * 1000;
  if (it.unit === "piece") return qty * (parseFloat(it.gPerUnit) || 100);
  const UNIT_G = { "c.à s.": 15, "c.à c.": 5, verre: 200, bol: 300 };
  return qty * (UNIT_G[it.unit] || 100);
}
function migrateMealsToFoodDb(meals) {
  return (meals || []).map((meal) => {
    if (!meal || !Array.isArray(meal.items) || !meal.items.length) return meal;
    let changed = false;
    const items = meal.items.map((it) => {
      const src = it.source || "db";
      if (src !== "db") return it;
      const hit = foodDbLookupExact(it.name) || foodDbLookup(it.name);
      if (!hit) return it;
      const gEqRaw = it.gramsEq != null ? it.gramsEq : (it.grams != null ? it.grams : itemGramsEq(it));
      const f = (parseFloat(gEqRaw) || 0) / 100;
      const next = { ...it, per100: { kcal: hit.kcal, protein: hit.protein, carbs: hit.carbs, fat: hit.fat },
        kcal: Math.round(hit.kcal * f), protein: Math.round(hit.protein * f), carbs: Math.round(hit.carbs * f), fat: Math.round(hit.fat * f), source: "db" };
      if (next.kcal !== it.kcal || next.protein !== it.protein || next.carbs !== it.carbs || next.fat !== it.fat) changed = true;
      return next;
    });
    if (!changed) return meal;
    const t = items.reduce((a, x) => ({ kcal: a.kcal+(x.kcal||0), protein: a.protein+(x.protein||0), carbs: a.carbs+(x.carbs||0), fat: a.fat+(x.fat||0) }), { kcal:0, protein:0, carbs:0, fat:0 });
    return { ...meal, items, kcal: t.kcal, protein: t.protein, carbs: t.carbs, fat: t.fat };
  });
}

function mealFromMenuRows(rows, name, date, foodLib, period) {
  const items = (rows || []).filter((r) => r.name && r.name.trim()).map((r) => {
    const key = r.name.trim().toLowerCase();
    const manual = (foodLib || []).find((f) => (f.name || "").toLowerCase() === key && f.source === "manuel");
    const p = manual || foodDbLookup(r.name) || { kcal: 0, protein: 0, carbs: 0, fat: 0, source: "inconnu" };
    const gEq = itemGramsEq(r); const f = gEq / 100;
    return { name: r.name.trim(), qty: parseFloat(r.qty) || 0, unit: r.unit || "g", gPerUnit: r.gPerUnit,
      gramsEq: Math.round(gEq),
      per100: { kcal: p.kcal || 0, protein: p.protein || 0, carbs: p.carbs || 0, fat: p.fat || 0 },
      kcal: Math.round((p.kcal || 0) * f), protein: Math.round((p.protein || 0) * f), carbs: Math.round((p.carbs || 0) * f), fat: Math.round((p.fat || 0) * f),
      source: p.source || "db", verified: true };
  });
  const t = items.reduce((a, x) => ({ kcal: a.kcal + x.kcal, protein: a.protein + x.protein, carbs: a.carbs + x.carbs, fat: a.fat + x.fat }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });
  return { id: uid(), date: date || todayISO(), name, period, mode: "ingredients", items, kcal: t.kcal, protein: t.protein, carbs: t.carbs, fat: t.fat };
}

  const toggle = (name) => setSel((s) => ({ ...s, [name]: { checked: !(s[name] && s[name].checked), qty: (s[name] && s[name].qty) != null ? s[name].qty : String(menuByName[name].qty) } }));

  const previewKcal = (name) => { const db = foodDbLookup(name); if (!db) return null; return Math.round((db.kcal * itemGramsEq(rowFor(name))) / 100); };

function MealBuilder({ initial, foodLib, onLearnIngredient, onSave, onCancel, onDelete }) {
  const hydrate = (it) => {
    const nm = (it.name || "").trim();
    const anyMacro = (it.kcal || 0) || (it.protein || 0) || (it.carbs || 0) || (it.fat || 0);
    if (it.unit || it.qty != null) {
      let resolved = null;
      if (it.per100) {
        resolved = { name: it.name, kcal: it.per100.kcal, protein: it.per100.protein, carbs: it.per100.carbs, fat: it.per100.fat, source: it.source || "db", basis: it.basis, assumption: it.assumption, confidence: it.confidence };
      } else if (nm && anyMacro) {
        const g = itemGramsEq(it); const f = g > 0 ? g / 100 : 0;
        if (f > 0) resolved = { name: it.name, kcal: Math.round((it.kcal || 0) / f), protein: Math.round((it.protein || 0) / f), carbs: Math.round((it.carbs || 0) / f), fat: Math.round((it.fat || 0) / f), source: it.source || "db" };
      }
      return { name: it.name || "", qty: it.qty != null ? String(it.qty) : "100", unit: it.unit || "g", gPerUnit: it.gPerUnit, resolved, verified: resolved ? (it.verified != null ? it.verified : true) : false };
    }
    // ancien format : { name, grams, kcal, ... }
    const grams = parseFloat(it.grams) || 0; const f = grams > 0 ? grams / 100 : 0;
    const resolved = (nm && anyMacro && f > 0) ? { name: it.name, kcal: Math.round((it.kcal || 0) / f), protein: Math.round((it.protein || 0) / f), carbs: Math.round((it.carbs || 0) / f), fat: Math.round((it.fat || 0) / f), source: it.source || "db" } : null;
    return { name: it.name || "", qty: String(grams || 100), unit: "g", resolved, verified: !!resolved };
  };
  const [m, setM] = useState(() => {
    if (!initial) { const h = new Date().getHours(); const period = h < 11 ? "matin" : h < 18 ? "midi" : "soir"; return { id: uid(), date: todayISO(), name: "", period, mode: "quick", kcal: "", protein: "", carbs: "", fat: "", items: [{ name: "", qty: "100", unit: "g" }] }; }
    const mode = initial.mode || (initial.items && initial.items.length ? "ingredients" : "quick");
    return { ...initial, period: initial.period || mealPeriod(initial), mode, items: (initial.items && initial.items.length ? initial.items.map(hydrate) : [{ name: "", qty: "100", unit: "g" }]) };
  });
  const [busy, setBusy] = useState(false);
  const [openVerify, setOpenVerify] = useState(null);
  const [showMenu, setShowMenu] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const editingExisting = !!(initial && initial.id && !initial._fresh);
  const knownFoods = useMemo(() => Array.from(new Set([...FOOD_DB.map((f) => f[0]), ...foodLib.map((f) => f.name)])).sort((a, b) => a.localeCompare(b)), [foodLib]);

  const upd = (patch) => setM((prev) => ({ ...prev, ...patch }));
  const setItems = (items) => upd({ items });
  const patchItem = (i, patch) => setM((prev) => ({ ...prev, items: prev.items.map((it, x) => (x === i ? { ...it, ...patch } : it)) }));

  const localResolve = (name) => {
    const key = (name || "").trim().toLowerCase();
    if (!key) return null;
    // 1. correction manuelle de l'utilisateur = prioritaire
    const manual = foodLib.find((f) => (f.name || "").toLowerCase() === key && f.source === "manuel");
    if (manual) return { name: manual.name, kcal: manual.kcal, protein: manual.protein, carbs: manual.carbs, fat: manual.fat, source: "manuel" };
    // 2. base intégrée = fait autorité, toujours à jour
    const db = foodDbLookup(name);
    if (db) return db;
    // 3. cache IA / autres
    const cached = foodLib.find((f) => (f.name || "").toLowerCase() === key);
    if (cached) return { name: cached.name, kcal: cached.kcal, protein: cached.protein, carbs: cached.carbs, fat: cached.fat, source: cached.source || "ai" };
    return null;
  };
  const onName = (i, v) => {
    const resolved = localResolve(v);
    patchItem(i, { name: v, resolved: resolved || null, verified: !!resolved });
  };
  const dbCandidates = (name) => {
    const q = (name || "").trim().toLowerCase();
    if (!q) return [];
    return FOOD_DB.filter((f) => f[0].toLowerCase().includes(q) || q.includes(f[0].toLowerCase()))
      .slice(0, 6).map((f) => ({ name: f[0], kcal: f[1], protein: f[2], carbs: f[3], fat: f[4], source: "db" }));
  };
  const runAi = async (i) => {
    const name = (m.items[i].name || "").trim();
    if (!name) return;
    patchItem(i, { loading: true });
    const r = await aiLookupIngredient(name);
    setM((prev) => ({ ...prev, items: prev.items.map((it, x) => (x === i ? { ...it, loading: false, resolved: r || { name, kcal: 0, protein: 0, carbs: 0, fat: 0, source: "inconnu" }, verified: false } : it)) }));
    if (r && onLearnIngredient) onLearnIngredient(r);
  };
  const setPer100 = (i, key, val) => {
    setM((prev) => ({ ...prev, items: prev.items.map((it, x) => {
      if (x !== i) return it;
      const base = it.resolved || { name: it.name, kcal: 0, protein: 0, carbs: 0, fat: 0 };
      return { ...it, resolved: { ...base, [key]: parseFloat(val) || 0, source: "manuel" }, verified: true };
    }) }));
  };
  const pickCandidate = (i, cand) => patchItem(i, { name: cand.name, resolved: cand, verified: true });

  const addItem = () => setItems([...m.items, { name: "", qty: "100", unit: "g" }]);
  const addFromMenu = (rows) => {
    setM((prev) => {
      const existing = (prev.items || []).filter((x) => (x.name || "").trim());
      const added = rows.map((it) => ({ name: it.name, qty: String(it.qty), unit: it.unit || "g", gPerUnit: it.gPerUnit, resolved: localResolve(it.name), verified: true }));
      const items = [...existing, ...added];
      return { ...prev, mode: "ingredients", items: items.length ? items : [{ name: "", qty: "100", unit: "g" }] };
    });
    setShowMenu(false);
  };
  const rmItem = (i) => { setItems(m.items.filter((_, x) => x !== i)); if (openVerify === i) setOpenVerify(null); };

  const perItem = (it) => {
    if (!it.resolved) return null;
    const f = itemGramsEq(it) / 100;
    return {
      kcal: Math.round((it.resolved.kcal || 0) * f),
      protein: Math.round((it.resolved.protein || 0) * f),
      carbs: Math.round((it.resolved.carbs || 0) * f),
      fat: Math.round((it.resolved.fat || 0) * f),
    };
  };
  const totals = m.items.reduce((a, it) => { const p = perItem(it); return p ? { kcal: a.kcal + p.kcal, protein: a.protein + p.protein, carbs: a.carbs + p.carbs, fat: a.fat + p.fat } : a; }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });
  const unresolvedCount = m.items.filter((it) => it.name.trim() && !it.resolved).length;
  const detailedKcal = macrosToKcal(m.protein, m.carbs, m.fat);

  const finalizeMeal = (mm) => {
    if (mm.mode === "quick") return { ...mm, kcal: Math.round(parseFloat(mm.kcal) || 0), protein: null, carbs: null, fat: null, items: undefined, _fresh: undefined };
    if (mm.mode === "detailed") return { ...mm, kcal: macrosToKcal(mm.protein, mm.carbs, mm.fat), protein: Math.round(parseFloat(mm.protein) || 0), carbs: Math.round(parseFloat(mm.carbs) || 0), fat: Math.round(parseFloat(mm.fat) || 0), items: undefined, _fresh: undefined };
    return mm;
  };

  const saveMeal = async () => {
    if (m.mode !== "ingredients") { onSave(finalizeMeal(m)); return; }
    setBusy(true);
    const items = [...m.items];
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (!it.name.trim()) continue;
      if (!it.resolved) {
        const r = await aiLookupIngredient(it.name.trim());
        items[i] = { ...it, resolved: r || { name: it.name.trim(), kcal: 0, protein: 0, carbs: 0, fat: 0, source: "inconnu" } };
        if (r && onLearnIngredient) onLearnIngredient(r);
      }
    }
    const built = items.filter((it) => it.name.trim()).map((it) => {
      const gEq = itemGramsEq(it); const f = gEq / 100;
      const p = it.resolved || { kcal: 0, protein: 0, carbs: 0, fat: 0 };
      return {
        name: it.name.trim(), qty: parseFloat(it.qty) || 0, unit: it.unit || "g",
        gPerUnit: it.gPerUnit != null && it.gPerUnit !== "" ? parseFloat(it.gPerUnit) : undefined,
        gramsEq: Math.round(gEq),
        per100: { kcal: p.kcal || 0, protein: p.protein || 0, carbs: p.carbs || 0, fat: p.fat || 0 },
        kcal: Math.round((p.kcal || 0) * f), protein: Math.round((p.protein || 0) * f), carbs: Math.round((p.carbs || 0) * f), fat: Math.round((p.fat || 0) * f),
        source: p.source || "manuel", verified: !!it.verified,
      };
    });
    const t = built.reduce((a, it) => ({ kcal: a.kcal + it.kcal, protein: a.protein + it.protein, carbs: a.carbs + it.carbs, fat: a.fat + it.fat }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });
    setBusy(false);
    onSave({ ...m, items: built, kcal: t.kcal, protein: t.protein, carbs: t.carbs, fat: t.fat, _fresh: undefined });
  };

  const canSave = m.name.trim() && (
    (m.mode === "quick" && m.kcal) ||
    (m.mode === "detailed" && (m.protein || m.carbs || m.fat)) ||
    (m.mode === "ingredients" && m.items.some((i) => i.name.trim()))
  );

  return (
    <Overlay title={initial && !initial._fresh ? "Modifier le repas" : "Nouveau repas"} onBack={onCancel}
      footer={
        <div>
          <Btn className="w-full" onClick={saveMeal} disabled={!canSave || busy} color={C.teal}>
            {busy ? <span className="flex items-center justify-center gap-2"><Loader size={16} className="animate-spin" /> Recherche des valeurs…</span> : "Enregistrer le repas"}
          </Btn>
          {editingExisting && onDelete && (confirmDel ? (
            <div className="flex gap-2 mt-3">
              <button onClick={() => onDelete(m.id)} className="flex-1 py-2.5 rounded-xl text-xs font-bold active:scale-95" style={{ background: "#F87171", color: "#0E1116" }}>Confirmer la suppression</button>
              <button onClick={() => setConfirmDel(false)} className="flex-1 py-2.5 rounded-xl text-xs font-bold active:scale-95" style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}` }}>Annuler</button>
            </div>
          ) : (
            <button onClick={() => setConfirmDel(true)} className="w-full text-center text-xs font-semibold mt-3 py-1" style={{ color: "#F87171" }}>Supprimer ce repas</button>
          ))}
        </div>
      }>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Nom du repas (optionnel)"><input className={inputCls} style={inputStyle} value={m.name} onChange={(e) => upd({ name: e.target.value })} placeholder="Ex : Déjeuner" /></Field>
        <Field label="Date"><input type="date" className={inputCls} style={inputStyle} value={m.date} onChange={(e) => upd({ date: e.target.value })} /></Field>
      </div>
      <Field label="Moment de la journée">
        <div className="flex gap-2">
          {[["matin", "Matin"], ["midi", "Midi / aprèm"], ["soir", "Soir / nuit"]].map(([k, l]) => (
            <button key={k} onClick={() => upd({ period: k })} className="flex-1 py-2.5 rounded-lg text-xs font-semibold active:scale-95"
              style={{ background: m.period === k ? C.teal + "22" : C.surface2, border: `1px solid ${m.period === k ? C.teal : C.border}`, color: m.period === k ? C.teal : C.muted }}>{l}</button>
          ))}
        </div>
      </Field>

      <div className="flex gap-1.5 mb-4">
        {[["quick", "Rapide"], ["detailed", "Macros"], ["ingredients", "Ingrédients"]].map(([k, lbl]) => {

/* ---------- helpers nutrition (dérivés) ---------- */
function nutMealsOn(meals, date) { return meals.filter((m) => m.date === date); }
function nutDayTotals(meals, date) {
  const list = nutMealsOn(meals, date);
  const t = list.reduce((a, m) => ({ kcal: a.kcal + (m.kcal || 0), protein: a.protein + (m.protein || 0), carbs: a.carbs + (m.carbs || 0), fat: a.fat + (m.fat || 0) }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });
  return { ...t, count: list.length, hasData: list.length > 0, list };
}
function nutIsTrainingDate(sessions, plan, date) {
  if (sessions.some((s) => s.date === date)) return true;
  const p = (plan || {})[date];
  return !!(p && (p.kind === "run" || p.kind === "program"));
}
function nutDayTarget(nutriProfile, sessions, plan, date) {
  return computeCalorieTarget(nutriProfile, nutIsTrainingDate(sessions, plan, date));
}
function nutDayInfo(meals, nutriProfile, sessions, plan, dayMeta, date) {
  const d = nutDayTotals(meals, date);
  const target = nutDayTarget(nutriProfile, sessions, plan, date);
  const validated = !!(dayMeta && dayMeta[date] && dayMeta[date].validated);
  const incomplete = d.hasData && d.count < 3 && !validated;
  let state = "empty";
  if (d.hasData) {
    if (!target) state = "logged";
    else if (d.kcal < target * 0.9) state = "under";
    else if (d.kcal > target * 1.1) state = "over";
    else state = "target";
  }
  return { state, incomplete, validated, kcal: d.kcal, target, count: d.count, hasData: d.hasData, totals: d };
}
const NUTRI_STATE_COL = (state) => state === "target" ? NUTRI_COL.target : state === "under" ? NUTRI_COL.under : state === "over" ? NUTRI_COL.over : state === "logged" ? C.teal : null;

/* ---------- frise nutrition ---------- */
function NutritionRibbon({ meals, sessions, plan, nutriProfile, dayMeta, onOpenDay }) {
  const today = todayISO();
  const [weekOffset, setWeekOffset] = useState(0);
  const scrollRef = useRef(null);
  const scrollTimer = useRef(null);
  const recenter = () => { if (scrollRef.current) scrollRef.current.scrollLeft = scrollRef.current.clientWidth; };
  useLayoutEffect(() => { recenter(); }, [weekOffset]);
  const onWeekScroll = (e) => {
    const el = e.currentTarget;
    clearTimeout(scrollTimer.current);
    scrollTimer.current = setTimeout(() => {
      const idx = Math.round(el.scrollLeft / el.clientWidth);
      if (idx === 0) setWeekOffset((o) => o - 1);
      else if (idx === 2) setWeekOffset((o) => o + 1);
    }, 90);
  };
  const goToday = () => setWeekOffset(0);
  const nodeStyle = (info, isToday) => {
    let s = { width: 27, height: 27, borderRadius: "50%", border: "2px solid", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, zIndex: 1, background: C.surface2, borderColor: C.border, color: C.muted, position: "relative" };
    if (info.state === "empty") { s = { ...s, background: NUTRI_EMPTY.bg, borderColor: NUTRI_EMPTY.border, color: NUTRI_EMPTY.text }; }
    else { const c = NUTRI_STATE_COL(info.state); s = { ...s, background: `linear-gradient(160deg, ${c}, ${c}CC)`, borderColor: c, color: "#0E1116", boxShadow: `inset 0 2px 3px rgba(255,255,255,.5), inset 0 -3px 5px rgba(0,0,0,.22), 0 3px 10px ${c}80` }; }
    if (isToday) { s.width = 33; s.height = 33; s.fontSize = 14; s.marginTop = -3; s.boxShadow = `0 0 10px ${C.teal}A6, 0 0 0 3px ${C.teal}4D`; s.borderColor = C.teal; }
    return s;
  };
  const selDays = weekDaysAt(weekOffset);
  const suivi = selDays.filter((dd) => nutDayInfo(meals, nutriProfile, sessions, plan, dayMeta, dd).hasData).length;
  const todo = selDays.filter((dd) => nutDayInfo(meals, nutriProfile, sessions, plan, dayMeta, dd).incomplete).length;
  const label = weekLabelFor(weekOffset);
  return (
    <div className="card-in mb-4" style={{ borderRadius: 18, overflow: "hidden", border: `1px solid ${C.border}`, background: `linear-gradient(180deg, rgba(45,212,191,.06), ${C.surface} 60%)` }}>
      <div style={{ padding: "12px 16px 4px" }} className="flex items-center justify-between">
        <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: ".2em", color: C.teal, fontWeight: 700 }}>{label}</div>
        <div className="flex items-center gap-1">
          <button onClick={() => setWeekOffset((o) => o - 1)} style={{ padding: 2 }}><ChevronLeft size={18} color={C.muted} /></button>
          <button onClick={() => setWeekOffset((o) => o + 1)} style={{ padding: 2 }}><ChevronRight size={18} color={C.muted} /></button>
        </div>
      </div>
      <div style={{ padding: "0 14px 14px" }}>
        <div className="text-center" style={{ fontSize: 11, color: C.muted }}>
          {suivi} jour{suivi > 1 ? "s" : ""} suivi{suivi > 1 ? "s" : ""}{todo > 0 ? ` · ${todo} à compléter` : ""}
        </div>
        <style>{`.nut-week-scroll::-webkit-scrollbar{display:none}`}</style>
        <div ref={scrollRef} className="nut-week-scroll" onScroll={onWeekScroll}
          style={{ display: "flex", overflowX: "auto", scrollSnapType: "x mandatory", scrollbarWidth: "none", msOverflowStyle: "none", overscrollBehaviorX: "contain", touchAction: "pan-x", paddingTop: 14, paddingBottom: 6 }}>
          {[weekOffset - 1, weekOffset, weekOffset + 1].map((off) => (
            <div key={off} className="relative px-1" style={{ minWidth: "100%", scrollSnapAlign: "start" }}>
              <div className="absolute left-2 right-2" style={{ top: 13, height: 2, background: C.border }} />
              <div className="relative grid grid-cols-7 justify-items-center">
                {weekDaysAt(off).map((date) => {
                  const info = nutDayInfo(meals, nutriProfile, sessions, plan, dayMeta, date);
                  const isToday = date === today;
                  return (
                    <button key={date} onClick={() => onOpenDay && onOpenDay(date)} className="flex flex-col items-center active:scale-95">
                      <div style={nodeStyle(info, isToday)} className={info.state !== "empty" ? "node-shine" : ""}>
                        {info.state !== "empty" ? <Check size={isToday ? 17 : 14} color="#0E1116" strokeWidth={3} /> : weekdayShort(date).charAt(0)}
                        {info.incomplete && <span style={{ position: "absolute", top: -4, right: -4, width: 12, height: 12, borderRadius: "50%", background: NUTRI_TODO, border: `2px solid ${C.surface}`, boxSizing: "border-box" }} />}
                      </div>
                      <div style={{ fontSize: 8, height: 10, marginTop: 4, fontWeight: 800, letterSpacing: ".08em", textTransform: "uppercase", color: isToday ? C.teal : "transparent" }}>auj</div>
                    </button>

          ))}
        </div>
        {weekOffset !== 0 && (
          <div className="flex justify-center mt-1">
            <button onClick={goToday} className="flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold active:scale-95"

            <span key={lbl} className="flex items-center gap-1.5" style={{ fontSize: 10, color: C.muted }}><span style={{ width: 11, height: 11, borderRadius: "50%", background: col }} /> {lbl}</span>
          ))}
          <span className="flex items-center gap-1.5" style={{ fontSize: 10, color: C.muted }}><span style={{ width: 11, height: 11, borderRadius: "50%", background: NUTRI_EMPTY.bg, border: `2px solid ${NUTRI_EMPTY.border}`, boxSizing: "border-box" }} /> Aucun repas</span>
          <span className="flex items-center gap-1.5" style={{ fontSize: 10, color: C.muted }}><span style={{ width: 11, height: 11, borderRadius: "50%", background: NUTRI_TODO }} /> À compléter</span>
        </div>
      </div>
    </div>
  );
}

/* ---------- vue évolution (nutrition) ---------- */
function NutritionEvolutionView({ meals, sessions, plan, nutriProfile, dayMeta, onOpenDay }) {
  const today = todayISO();
  const info30 = useMemo(() => {
    const arr = [];
    for (let b = 29; b >= 0; b--) {
      const date = addDays(today, -b);
      const i = nutDayInfo(meals, nutriProfile, sessions, plan, dayMeta, date);
      arr.push({ date, ...i });
    }
    return arr;
  }, [meals, sessions, plan, nutriProfile, dayMeta, today]);

  const tracked = info30.filter((x) => x.hasData);
  const tracked7 = tracked.filter((x) => x.date >= addDays(today, -6));
  const avg = (list) => list.length ? Math.round(list.reduce((a, x) => a + x.kcal, 0) / list.length) : null;
  const avg7 = avg(tracked7);
  const avg30 = avg(tracked);
  const complete = tracked.filter((x) => !x.incomplete);
  const withTarget = complete.filter((x) => x.target);
  const adherence = withTarget.length ? Math.round((withTarget.filter((x) => x.state === "target").length / withTarget.length) * 100) : null;
  const todoCount = tracked.filter((x) => x.incomplete).length;

  const macroSum = tracked.reduce((a, x) => ({ p: a.p + x.totals.protein, c: a.c + x.totals.carbs, f: a.f + x.totals.fat }), { p: 0, c: 0, f: 0 });
  const pKcal = macroSum.p * 4, cKcal = macroSum.c * 4, fKcal = macroSum.f * 9;
  const macroTot = pKcal + cKcal + fKcal;
  const pct = (v) => macroTot ? Math.round((v / macroTot) * 100) : 0;

  const trainDays = tracked.filter((x) => nutIsTrainingDate(sessions, plan, x.date));
  const restDays = tracked.filter((x) => !nutIsTrainingDate(sessions, plan, x.date));
  const avgTrain = avg(trainDays), avgRest = avg(restDays);

  const chartData = info30.slice(-14).filter((x) => x.hasData).map((x) => ({ iso: x.date, date: fmtDate(x.date), kcal: x.kcal, objectif: x.target || null, state: x.state }));

  if (tracked.length === 0) return (
    <div>
      <h2 className="text-lg font-bold mb-3">Évolution</h2>
      <EmptyState text="Note tes repas pour voir tes moyennes, ton adhérence et ton évolution apparaître ici." />
    </div>
  );

  return (
    <div>
      <h2 className="text-lg font-bold mb-3">Évolution</h2>
      <div className="grid grid-cols-3 gap-3 mb-3">
        <Stat label="Moy. 7 j" value={avg7 != null ? avg7 : "—"} sub="kcal / jour" color={C.teal} />
        <Stat label="Moy. 30 j" value={avg30 != null ? avg30 : "—"} sub="kcal / jour" />
        <Stat label="Adhérence" value={adherence != null ? adherence + "%" : "—"} sub="jours dans la cible" color={C.green} />
      </div>

      {todoCount > 0 && (
        <div className="rounded-xl p-3 mb-3 flex items-center gap-2 text-[12px]" style={{ background: NUTRI_TODO + "14", border: `1px solid ${NUTRI_TODO}55`, color: NUTRI_TODO }}>
          <span style={{ width: 9, height: 9, borderRadius: "50%", background: NUTRI_TODO, flex: "none" }} /> {todoCount} jour{todoCount > 1 ? "s" : ""} à compléter sur 30 jours — non comptés dans l'adhérence.
        </div>
      )}

      <div className="rounded-xl p-3 mb-3" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="text-xs mb-1" style={{ color: C.muted }}>Répartition moyenne des macros</div>
        {macroTot ? (
          <>
            <div className="flex h-2.5 rounded-full overflow-hidden mt-1" style={{ background: C.bg }}>
              <div style={{ width: `${pct(pKcal)}%`, background: C.ember }} />
              <div style={{ width: `${pct(cKcal)}%`, background: C.sky }} />
              <div style={{ width: `${pct(fKcal)}%`, background: C.gold }} />
            </div>
            <div className="flex justify-between text-[11px] mt-1.5">
              <span style={{ color: C.ember }}>{pct(pKcal)}% P</span>
              <span style={{ color: C.sky }}>{pct(cKcal)}% G</span>
              <span style={{ color: C.gold }}>{pct(fKcal)}% L</span>
            </div>
          </>
        ) : <div className="text-[12px]" style={{ color: C.muted }}>Ajoute des repas en mode Macros ou Ingrédients pour voir la répartition.</div>}
      </div>

      {(avgTrain != null || avgRest != null) && (
        <div className="rounded-xl p-3 mb-3" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <div className="text-xs mb-2" style={{ color: C.muted }}>Jour d'entraînement vs repos (moy. kcal)</div>
          <div className="grid grid-cols-2 gap-3">
            <div className="rounded-xl p-3 text-center" style={{ background: C.surface2, border: `1px solid ${C.border}` }}><div className="font-mono font-extrabold text-lg" style={{ color: C.ember }}>{avgTrain != null ? avgTrain : "—"}</div><div className="text-[10px]" style={{ color: C.muted }}>Entraînement</div></div>
            <div className="rounded-xl p-3 text-center" style={{ background: C.surface2, border: `1px solid ${C.border}` }}><div className="font-mono font-extrabold text-lg" style={{ color: C.sky }}>{avgRest != null ? avgRest : "—"}</div><div className="text-[10px]" style={{ color: C.muted }}>Repos</div></div>
          </div>
        </div>
      )}

      <ChartCard title="Calories par jour" sub="barres = apport · ligne = objectif du jour · touche une barre pour ouvrir le jour">
        {chartData.length > 0 ? (
          <ResponsiveContainer width="100%" height={200}>
            <ComposedChart data={chartData} onClick={(st) => { const i = st && st.activeTooltipIndex; if (i != null && chartData[i] && onOpenDay) onOpenDay(chartData[i].iso); }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false} />
              <XAxis dataKey="date" tick={{ fill: C.muted, fontSize: 10 }} />
              <YAxis tick={{ fill: C.muted, fontSize: 11 }} />
              <Tooltip contentStyle={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text }} />
              <Bar dataKey="kcal" name="Apport (kcal)" radius={[4, 4, 0, 0]}>
                {chartData.map((entry, idx) => <Cell key={idx} fill={NUTRI_STATE_COL(entry.state) || C.teal} cursor="pointer" />)}
              </Bar>
              <Line dataKey="objectif" name="Objectif" stroke={C.muted} strokeDasharray="4 4" strokeWidth={1.5} dot={false} connectNulls />
            </ComposedChart>
          </ResponsiveContainer>
        ) : <p className="text-sm text-center py-6" style={{ color: C.muted }}>Pas encore assez de données.</p>}
      </ChartCard>
    </div>
  );
}

function HomeView({ stats, sessions, plan, goals, motivation, onNew, onStartType, onDetail }) {
  const activeGoal = goals.find((g) => !g.done);
  const goalPct = activeGoal ? Math.min(100, Math.round(((parseFloat(activeGoal.current) || 0) / (parseFloat(activeGoal.target) || 1)) * 100)) : 0;
  const today = todayISO();
  const [weekOffset, setWeekOffset] = useState(0); // 0 = cette semaine, +/- illimité
  const scrollRef = useRef(null);
  const scrollTimer = useRef(null);
  const recenter = () => { if (scrollRef.current) scrollRef.current.scrollLeft = scrollRef.current.clientWidth; };
  useLayoutEffect(() => { recenter(); }, [weekOffset]);
  const onWeekScroll = (e) => {
    const el = e.currentTarget;
    clearTimeout(scrollTimer.current);
    scrollTimer.current = setTimeout(() => {
      const idx = Math.round(el.scrollLeft / el.clientWidth);
      if (idx === 0) setWeekOffset((o) => o - 1);
      else if (idx === 2) setWeekOffset((o) => o + 1);
    }, 90);
  };
  const goWeek = (delta) => setWeekOffset((o) => o + delta);
  const goToday = () => setWeekOffset(0);
  const [previewDate, setPreviewDate] = useState(null);
  const selDays = weekDaysAt(weekOffset);
  const weekSessionCount = sessions.filter((s) => selDays.includes(s.date)).length;
  const weekLabel = weekLabelFor(weekOffset);
  const dayState = (date) => {
    const logged = sessions.filter((s) => s.date === date);
    if (logged.length) return { state: "done", run: logged.every((s) => isRun(s)) };
    const p = (plan || {})[date];
    if (p && p.kind === "run") return { state: "plan", run: true };
    if (p && p.kind === "program") return { state: "plan", run: false };
    return { state: "rest" };
  };
  const nodeStyle = (st, isToday) => {
    let s = { width: 27, height: 27, borderRadius: "50%", border: "2px solid", display: "flex",
      alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, zIndex: 1,
      background: C.surface2, borderColor: C.border, color: C.muted };
    if (st.state === "done") {
      const c = st.run ? C.sky : C.ember;
      s = { ...s, background: `linear-gradient(160deg, ${c}, ${c}CC)`, borderColor: c, color: "#0E1116",
        boxShadow: `inset 0 2px 3px rgba(255,255,255,.5), inset 0 -3px 5px rgba(0,0,0,.22), 0 3px 10px ${c}80` };
    }
    else if (st.state === "plan") { const c = st.run ? C.sky : C.ember; s = { ...s, background: "transparent", borderColor: c, color: c }; }
    else { s = { ...s, background: REST_COL.bg, borderColor: REST_COL.border, color: REST_COL.text }; }
    if (isToday) {
      s.width = 33; s.height = 33; s.fontSize = 14; s.marginTop = -3;
      s.boxShadow = "0 0 10px rgba(255,106,61,.65), 0 0 0 3px rgba(255,106,61,.3)";
      s.borderColor = C.ember;
    }
    return s;
  };
  const doneCount = selDays.filter((d) => sessions.some((s) => s.date === d)).length;
  const upcoming = selDays.filter((d) => (weekOffset > 0 || d >= today) && !sessions.some((s) => s.date === d)
    && (plan || {})[d] && ((plan[d].kind === "run") || (plan[d].kind === "program"))).length;
  const goalReached = stats.target > 0 && weekSessionCount >= stats.target;

  return (
    <div>
      <div className="card-in mb-4" style={{ borderRadius: 18, overflow: "hidden", border: `1px solid ${C.border}`, boxShadow: "0 8px 24px rgba(0,0,0,.28)",
        background: "radial-gradient(120% 90% at 15% -10%, rgba(255,106,61,.28), transparent 55%), linear-gradient(180deg,#241a1c,#141317 65%,#0E1116)" }}>

        {/* bandeau teinté */}

            <div style={{ position: "absolute", top: "-14%", bottom: "-14%", right: "-16%", width: "80%", zIndex: 1, pointerEvents: "none" }}>
              <svg viewBox="0 0 1179 923" fill="none" style={{ width: "100%", height: "100%", overflow: "visible" }}>
                <path d="M 974,77 L 958,76 L 896,116 L 725,261 L 556,456 L 464,600 L 407,497 L 373,460 L 320,455 L 276,482 L 274,496 L 303,511 L 345,567 L 426,761 L 441,760 L 506,713 L 544,624 L 607,509 L 752,316 L 852,214 L 981,109 L 985,97 Z"
                  fill="#FF6A3D" opacity="0.4" />
              </svg>

function SwipeRow({ onDelete, onDuplicate, children }) {
  const [dx, setDx] = useState(0);
  const st = useRef({ x0: 0, base: 0, active: false });
  const OPEN = -142;
  const begin = (x) => { st.current = { x0: x, base: dx, active: true }; };
  const move = (x) => { if (!st.current.active) return; const d = Math.max(OPEN, Math.min(0, st.current.base + (x - st.current.x0))); setDx(d); };
  const end = () => { if (!st.current.active) return; st.current.active = false; setDx((cur) => (cur < OPEN / 2 ? OPEN : 0)); };
  return (
    <div style={{ position: "relative", overflow: "hidden", borderRadius: 12 }}>
      <div style={{ position: "absolute", inset: 0, display: "flex", justifyContent: "flex-end" }}>
        <button onClick={() => { setDx(0); onDuplicate(); }} className="flex flex-col items-center justify-center gap-1" style={{ width: 71, background: C.surface2, color: C.sky }}>
          <Copy size={17} /><span className="text-[10px] font-bold">Dupliquer</span>
        </button>
        <button onClick={() => { setDx(0); onDelete(); }} className="flex flex-col items-center justify-center gap-1" style={{ width: 71, background: "#F87171", color: "#0E1116" }}>
          <Trash2 size={17} /><span className="text-[10px] font-bold">Suppr.</span>
        </button>
      </div>
      <div onTouchStart={(e) => begin(e.touches[0].clientX)} onTouchMove={(e) => move(e.touches[0].clientX)} onTouchEnd={end}
        style={{ transform: `translateX(${dx}px)`, transition: st.current.active ? "none" : "transform .2s ease", position: "relative" }}>
        {children}
      </div>
    </div>
  );
}

function FloatingChrono({ active, isEffort, elapsed, fmt, onToggle, onStop, onStart }) {
  const [pos, setPos] = useState(null);
  const ptr = useRef({ x0: 0, y0: 0, l0: 0, t0: 0, moved: false, downAt: 0, longFired: false });
  const longTimer = useRef(null);
  useEffect(() => {
    (async () => {
      const saved = await loadKey("ft:chronoPos", null);
      if (saved && typeof saved.left === "number") setPos(saved);
      else setPos({ left: typeof window !== "undefined" ? window.innerWidth - 76 : 300, top: 96 });
    })();
  }, []);
  if (!pos) return null;
  const col = isEffort ? C.ember : C.sky;
  const SIZE = 60;
  const vw = typeof window !== "undefined" ? window.innerWidth : 400;
  const vh = typeof window !== "undefined" ? window.innerHeight : 700;
  const clamp = (l, t) => ({
    left: Math.max(6, Math.min(vw - SIZE - 6, l)),
    top: Math.max(58, Math.min(vh - SIZE - 6, t)),
  });

  const onDown = (e) => {
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    ptr.current = { x0: e.clientX, y0: e.clientY, l0: pos.left, t0: pos.top, moved: false, downAt: Date.now(), longFired: false };
    longTimer.current = setTimeout(() => {
      if (ptr.current.moved) return;
      ptr.current.longFired = true;
      if (active) onStop();
    }, 480);
  };
  const onMove = (e) => {
    const dx = e.clientX - ptr.current.x0, dy = e.clientY - ptr.current.y0;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
      ptr.current.moved = true;
      clearTimeout(longTimer.current);
      setPos(clamp(ptr.current.l0 + dx, ptr.current.t0 + dy));
    }
  };
  const onUp = () => {
    clearTimeout(longTimer.current);
    if (ptr.current.moved) { setPos((p) => { saveKey("ft:chronoPos", p); return p; }); }
    else if (!ptr.current.longFired) { active ? onToggle() : onStart("effort"); }
  };

  return (
    <div
      onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onContextMenu={(e) => e.preventDefault()}
      style={{
        position: "fixed", left: pos.left, top: pos.top, zIndex: 62, width: SIZE, height: SIZE, borderRadius: "50%",
        display: "flex", alignItems: "center", justifyContent: "center", touchAction: "none", cursor: "grab",
        background: `radial-gradient(circle at 50% 35%, ${col}59, ${col}14 70%)`,
        border: `1.5px solid ${col}`, boxShadow: `0 8px 22px ${col}40`,
        userSelect: "none", WebkitUserSelect: "none", WebkitTouchCallout: "none",
      }}
      title="Tap : démarrer / enregistrer et basculer effort-repos · Glisser : déplacer · Appui long : arrêter">
      {active && (
        <div style={{
          position: "absolute", inset: -4, borderRadius: "50%", border: `1.5px dashed ${col}59`,
          animation: "spinChrono 6s linear infinite",
        }} />
      )}
      {active ? (
        <span className="font-mono font-extrabold" style={{ color: col, fontSize: 14 }}>{fmt(elapsed)}</span>
      ) : (
        <Play size={22} color={col} />
      )}
    </div>
  );
}
