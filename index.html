/* ---------- SAUVEGARDE / RESTAURATION ---------- */
function BackupPanel({ data, onRestore, onBack }) {
  const exportText = useMemo(() => JSON.stringify(
    { app: "suivi-entrainement", version: 1, exportedAt: new Date().toISOString(), ...data }, null, 2
  ), [data]);
  const [paste, setPaste] = useState("");
  const [msg, setMsg] = useState("");
  const [confirming, setConfirming] = useState(false);

  const counts = `${(data.sessions || []).length} séances · ${(data.programs || []).length} programmes · ${(data.goals || []).length} objectifs`;

  const copy = async () => {
    try { await navigator.clipboard.writeText(exportText); setMsg("Copié dans le presse-papiers ✓"); }
    catch { setMsg("Copie auto indisponible — sélectionne le texte et copie-le à la main."); }
    setTimeout(() => setMsg(""), 3000);
  };

  const doRestore = () => {
    let obj;
    try { obj = JSON.parse(paste); }
    catch { setMsg("❌ Texte invalide : ce n'est pas une sauvegarde JSON valide."); setConfirming(false); return; }
    const payload = {};
    if (obj.profile && typeof obj.profile === "object") payload.profile = obj.profile;
    if (Array.isArray(obj.sessions)) payload.sessions = obj.sessions;
    if (Array.isArray(obj.programs)) payload.programs = obj.programs;
    if (Array.isArray(obj.goals)) payload.goals = obj.goals;
    if (Object.keys(payload).length === 0) { setMsg("❌ Aucune donnée reconnue dans ce texte."); setConfirming(false); return; }
    onRestore(payload);
    setMsg("✓ Sauvegarde restaurée !");
    setPaste(""); setConfirming(false);
  };

  return (
    <Overlay title="Sauvegarde & restauration" onBack={onBack}>
      {msg && <div className="rounded-lg px-3 py-2 mb-3 text-sm" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>{msg}</div>}

      {/* EXPORT */}
      <div className="rounded-xl p-4 mb-4" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex items-center gap-2 mb-1"><Download size={17} color={C.sky} /><span className="font-semibold text-sm">Exporter mes données</span></div>
        <p className="text-xs mb-3" style={{ color: C.muted }}>{counts}. Copie ce texte et garde-le en lieu sûr (note, mail, fichier).</p>
        <textarea readOnly value={exportText} onFocus={(e) => e.target.select()}
          className="w-full rounded-lg px-3 py-2 font-mono text-[11px] leading-relaxed" style={{ ...inputStyle, height: 140 }} />
        <Btn className="w-full mt-3" onClick={copy}><span className="flex items-center justify-center gap-2"><Copy size={15} /> Copier la sauvegarde</span></Btn>
      </div>

      {/* IMPORT */}
      <div className="rounded-xl p-4" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex items-center gap-2 mb-1"><Upload size={17} color={C.ember} /><span className="font-semibold text-sm">Restaurer une sauvegarde</span></div>
        <p className="text-xs mb-3" style={{ color: C.muted }}>Colle ici un texte exporté. Cela <span style={{ color: C.ember }}>remplacera</span> les données correspondantes.</p>
        <textarea value={paste} onChange={(e) => { setPaste(e.target.value); setConfirming(false); }}
          placeholder="Colle ta sauvegarde JSON ici…"
          className="w-full rounded-lg px-3 py-2 font-mono text-[11px]" style={{ ...inputStyle, height: 110 }} />
        {!confirming
          ? <Btn kind="ghost" className="w-full mt-3" disabled={!paste.trim()} onClick={() => { setConfirming(true); setMsg(""); }}>Restaurer…</Btn>
          : <div className="flex gap-2 mt-3">
              <Btn className="flex-1" onClick={doRestore}><span className="flex items-center justify-center gap-2"><Check size={15} /> Confirmer le remplacement</span></Btn>
              <Btn kind="ghost" onClick={() => setConfirming(false)}>Annuler</Btn>
            </div>}
      </div>
    </Overlay>
  );
}

/* ================= APP ================= */
function App() {
  const [ready, setReady] = useState(false);
  const [storageError, setStorageError] = useState(false);
  const [view, setView] = useState("home");
  const [nutriView, setNutriView] = useState("home");
  const [mode, setMode] = useState("training");
  const [profile, setProfile] = useState({ name: "", sport: "", level: "", weeklyTarget: 3 });
  const [sessions, setSessions] = useState([]);
  const [programs, setPrograms] = useState([]);
  const [goals, setGoals] = useState([]);
  const [plan, setPlan] = useState({});
  const [meals, setMeals] = useState([]);
  const [foodLib, setFoodLib] = useState([]);
  const [weightLog, setWeightLog] = useState([]);
  const [supplements, setSupplements] = useState({});
  const [nutriProfile, setNutriProfile] = useState({ weightKg: "", heightCm: "", age: "", sex: "m", activity: "moderate", goalPct: "10" });
  const [dayMeta, setDayMeta] = useState({});
  const [skips, setSkips] = useState({});
  const [drafts, setDrafts] = useState({});
  const [confirmDiscard, setConfirmDiscard] = useState(false);
  const draftList = Object.values(drafts).filter(draftHasContent).sort((a, b) => (b._ts || 0) - (a._ts || 0));
  const pendingDraft = draftList[0] || null;
  const hasDraft = draftList.length > 0;

  const [overlay, setOverlay] = useState(null);
  const [sessionDraft, setSessionDraft] = useState(null);
  const [programDraft, setProgramDraft] = useState(null);
  const [goalDraft, setGoalDraft] = useState(null);
  const [mealDraft, setMealDraft] = useState(null);
  const [quickMeal, setQuickMeal] = useState(false);
  const [menuPick, setMenuPick] = useState(null);
  const [saveState, setSaveState] = useState("idle");
  const [starting, setStarting] = useState(false);
  const saveTimer = useRef();
  const [detail, setDetail] = useState(null);
  const [nutriDayDate, setNutriDayDate] = useState(null);
  const [motivation] = useState(() => MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)]);

  useEffect(() => {
    (async () => {
      const DEF_PROFILE = { name: "", sport: "", level: "", weeklyTarget: 3 };
      const DEF_NUTRI = { weightKg: "", heightCm: "", age: "", sex: "m", activity: "moderate", goalPct: "10" };
      if (!hasStore()) { WRITES_ENABLED = false; setStorageError(true); setReady(true); return; }
      let keys = [];
      try { const l = await window.storage.list(); keys = (l && l.keys) || []; }
      catch (e) { WRITES_ENABLED = false; setStorageError(true); setReady(true); return; }
      const has = (k) => keys.includes(k);
      let readFailed = false;
      const get = async (k, fb) => {
        if (!has(k)) return fb;
        try { const r = await window.storage.get(k); return (r && r.value != null) ? JSON.parse(r.value) : fb; }
        catch (e) { readFailed = true; return fb; }
      };
      const [prof, sess, progs, gls, pln, loadedMeals, loadedFoodLib, dbv, wlog, supp, nprof, dmeta, skps, loadedDrafts, legacyDraft, seeded] = await Promise.all([
        get(KEY.profile, DEF_PROFILE), get(KEY.sessions, []), get(KEY.programs, []), get(KEY.goals, []),
        get(KEY.plan, {}), get(KEY.meals, []), get(KEY.foodLib, []), get(KEY.foodDbVersion, 0),
        get(KEY.weightLog, []), get(KEY.supplements, {}), get(KEY.nutriProfile, DEF_NUTRI),
        get(KEY.dayMeta, {}), get(KEY.skips, {}), get(KEY.drafts, {}), get(KEY.draft, null),
        get(KEY.seededHandstand, false),
      ]);
      setProfile(prof); setSessions(sess); setPrograms(progs); setGoals(gls); setPlan(pln);
      setWeightLog(wlog); setSupplements(supp); setNutriProfile(nprof); setDayMeta(dmeta); setSkips(skps);
      if (readFailed) { WRITES_ENABLED = false; setStorageError(true); setMeals(loadedMeals); setFoodLib(loadedFoodLib); setReady(true); return; }
      WRITES_ENABLED = true;
      const dmap = (loadedDrafts && typeof loadedDrafts === "object" && !Array.isArray(loadedDrafts)) ? { ...loadedDrafts } : {};
      const legacyExisted = !!(legacyDraft && legacyDraft.id && draftHasContent(legacyDraft));
      if (legacyExisted && !dmap[legacyDraft.id]) dmap[legacyDraft.id] = { ...legacyDraft, _ts: legacyDraft._ts || Date.now() };
      setDrafts(dmap);
      if (legacyExisted) { saveKey(KEY.drafts, dmap); deleteKey(KEY.draft); }
      if (dbv < FOOD_DB_VERSION) {
        const migratedMeals = migrateMealsToFoodDb(loadedMeals);
        const cleanedLib = loadedFoodLib.filter((f) => f.source !== "db");
        setMeals(migratedMeals); setFoodLib(cleanedLib);
        saveKey(KEY.meals, migratedMeals); saveKey(KEY.foodLib, cleanedLib); saveKey(KEY.foodDbVersion, FOOD_DB_VERSION);
      } else { setMeals(loadedMeals); setFoodLib(loadedFoodLib); }
      if (!seeded) {
        const hp = makeHandstandProgram();
        setPrograms((prev) => { const next = [...prev, hp]; saveKey(KEY.programs, next); return next; });
        saveKey(KEY.seededHandstand, true);
      }
      setReady(true);
    })();
  }, []);

  useEffect(() => {
    if (overlay === "session" && sessionDraft && !sessionDraft.editing && draftHasContent(sessionDraft)) {
      setDrafts((prev) => { const next = { ...prev, [sessionDraft.id]: { ...sessionDraft, _ts: Date.now() } }; saveKey(KEY.drafts, next); return next; });
    }
  }, [sessionDraft, overlay]);

  const flash = useCallback((promise) => {
    setSaveState("saving");
    Promise.resolve(promise).then((res) => {
      const ok = Array.isArray(res) ? res.every(Boolean) : res !== false;
      setSaveState(ok ? "saved" : "error");
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => setSaveState("idle"), ok ? 2200 : 6000);
    }).catch(() => setSaveState("error"));
  }, []);

  const dataRef = useRef({});
  dataRef.current = { sessions, programs, goals, plan, profile, meals, weightLog, supplements, nutriProfile, dayMeta, skips };
  const undoStack = useRef([]);
  const redoStack = useRef([]);
  const [hist, setHist] = useState({ u: 0, r: 0 });
  const pushUndo = useCallback(() => {
    undoStack.current.push(JSON.parse(JSON.stringify(dataRef.current)));
    if (undoStack.current.length > 50) undoStack.current.shift();
    redoStack.current = [];
    setHist({ u: undoStack.current.length, r: 0 });
  }, []);
  const applyData = useCallback((d) => {
    setSessions(d.sessions); setPrograms(d.programs); setGoals(d.goals); setPlan(d.plan); setProfile(d.profile);
    if (d.meals) setMeals(d.meals);
    if (d.weightLog) setWeightLog(d.weightLog);
    if (d.supplements) setSupplements(d.supplements);
    if (d.nutriProfile) setNutriProfile(d.nutriProfile);
    if (d.dayMeta) setDayMeta(d.dayMeta);
    if (d.skips) setSkips(d.skips);
    flash(Promise.all([
      saveKey(KEY.sessions, d.sessions), saveKey(KEY.programs, d.programs),
      saveKey(KEY.goals, d.goals), saveKey(KEY.plan, d.plan), saveKey(KEY.profile, d.profile),
      ...(d.meals ? [saveKey(KEY.meals, d.meals)] : []),
      ...(d.weightLog ? [saveKey(KEY.weightLog, d.weightLog)] : []),
      ...(d.supplements ? [saveKey(KEY.supplements, d.supplements)] : []),
      ...(d.nutriProfile ? [saveKey(KEY.nutriProfile, d.nutriProfile)] : []),
      ...(d.dayMeta ? [saveKey(KEY.dayMeta, d.dayMeta)] : []),
      ...(d.skips ? [saveKey(KEY.skips, d.skips)] : []),
    ]));
  }, [flash]);
  const undo = useCallback(() => {
    if (!undoStack.current.length) return;
    redoStack.current.push(JSON.parse(JSON.stringify(dataRef.current)));
    applyData(undoStack.current.pop());
    setHist({ u: undoStack.current.length, r: redoStack.current.length });
    if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(12);
  }, [applyData]);
  const redo = useCallback(() => {
    if (!redoStack.current.length) return;
    undoStack.current.push(JSON.parse(JSON.stringify(dataRef.current)));
    applyData(redoStack.current.pop());
    setHist({ u: undoStack.current.length, r: redoStack.current.length });
    if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(12);
  }, [applyData]);

  const persistSessions = useCallback((next) => { pushUndo(); setSessions(next); flash(saveKey(KEY.sessions, next)); }, [flash, pushUndo]);
  const persistGoals = useCallback((next) => { pushUndo(); setGoals(next); flash(saveKey(KEY.goals, next)); }, [flash, pushUndo]);
  const persistPrograms = useCallback((next) => { pushUndo(); setPrograms(next); flash(saveKey(KEY.programs, next)); }, [flash, pushUndo]);
  const persistProfile = useCallback((next) => { setProfile(next); flash(saveKey(KEY.profile, next)); }, [flash]);
  const persistPlan = useCallback((next) => { pushUndo(); setPlan(next); flash(saveKey(KEY.plan, next)); }, [flash, pushUndo]);
  const persistMeals = useCallback((next) => { pushUndo(); setMeals(next); flash(saveKey(KEY.meals, next)); }, [flash, pushUndo]);
  const persistFoodLib = useCallback((next) => { setFoodLib(next); flash(saveKey(KEY.foodLib, next)); }, [flash]);
  const persistWeightLog = useCallback((next) => { pushUndo(); setWeightLog(next); flash(saveKey(KEY.weightLog, next)); }, [flash, pushUndo]);
  const persistSupplements = useCallback((next) => { pushUndo(); setSupplements(next); flash(saveKey(KEY.supplements, next)); }, [flash, pushUndo]);
  const persistNutriProfile = useCallback((next) => { pushUndo(); setNutriProfile(next); flash(saveKey(KEY.nutriProfile, next)); }, [flash, pushUndo]);
  const persistDayMeta = useCallback((next) => { pushUndo(); setDayMeta(next); flash(saveKey(KEY.dayMeta, next)); }, [flash, pushUndo]);
  const persistSkips = useCallback((next) => { pushUndo(); setSkips(next); flash(saveKey(KEY.skips, next)); }, [flash, pushUndo]);
  const toggleSkip = (date) => { const next = { ...skips }; if (next[date]) delete next[date]; else next[date] = true; persistSkips(next); };

  const stats = useMemo(() => {
    const cw = currentWeekKey();
    const weekCounts = {};
    sessions.forEach((s) => { const k = isoWeekKey(s.date); weekCounts[k] = (weekCounts[k] || 0) + 1; });
    const thisWeek = weekCounts[cw] || 0;
    const target = profile.weeklyTarget || 3;
    let streak = 0;
    for (let back = 0; back < 104; back++) {
      const k = prevWeekKey(cw, back);
      const cnt = weekCounts[k] || 0;
      if (back === 0) { if (cnt >= target) streak++; else continue; }
      else { if (cnt >= target) streak++; else break; }
    }
    if (thisWeek < target) { streak = 0; for (let back = 1; back < 104; back++) { const cnt = weekCounts[prevWeekKey(cw, back)] || 0; if (cnt >= target) streak++; else break; } }
    const weekSessions = sessions.filter((s) => isoWeekKey(s.date) === cw);
    const weekKm = weekSessions.filter(isRun).reduce((a, s) => a + (parseFloat(s.distanceKm) || 0), 0);
    const weekReps = weekSessions.filter((s) => !isRun(s)).reduce((a, s) => a + sessionReps(s), 0);
    return { thisWeek, target, streak, total: sessions.length, weekKm, weekReps };
  }, [sessions, profile.weeklyTarget]);

  const knownPartners = useMemo(() => { const s = new Set(); sessions.forEach((x) => (x.partners || []).forEach((p) => p && s.add(p))); return [...s]; }, [sessions]);

  if (!ready) return <div className="min-h-screen flex items-center justify-center" style={{ background: C.bg, color: C.muted }}>Chargement…</div>;

  const recentMeals = (() => {
    const seen = new Set(); const out = [];
    [...meals].sort((a, b) => (b.date || "").localeCompare(a.date || "")).forEach((mm) => { const k = (mm.name || "").trim().toLowerCase(); if (mm.name && mm.name.trim() && !seen.has(k)) { seen.add(k); out.push(mm); } });
    return out.slice(0, 6);
  })();

  const openNewMealForDate = (date) => { setMealDraft({ id: uid(), date: date || todayISO(), name: "", period: "midi", mode: "quick", kcal: "", protein: "", carbs: "", fat: "", items: [{ name: "", qty: "100", unit: "g" }] }); setOverlay("meal"); };
  const validateDay = (date) => { const next = { ...dayMeta, [date]: { ...(dayMeta[date] || {}), validated: !(dayMeta[date] && dayMeta[date].validated) } }; persistDayMeta(next); };

  const openNewSession = (prefill) => {
    setSessionDraft(prefill || { id: uid(), type: "workout", date: todayISO(), name: "", durationMin: "", rpe: "", feeling: "", notes: "", exercises: [{ name: "", sets: [{ reps: "", hold: "", weight: "", rpe: "" }] }], distanceKm: "", runKind: "continu", partners: [] });
    setOverlay("session");
  };
  const prefillFromProgram = (p, date) => ({
    id: uid(), type: "workout", date: date || todayISO(), name: p.name, durationMin: "", rpe: "", feeling: "", notes: "",
    distanceKm: "", runKind: "continu", partners: [], programId: p.id,
    exercises: (p.exercises && p.exercises.length ? p.exercises : [{ name: "" }]).map((e) => {
      const n = Math.min(8, Math.max(1, parseInt(e.targetSets) || 1));
      const kind = e.kind || "dynamic";
      const unit = kind === "static" ? "s" : "reps";
      const target = (e.targetSets || e.targetReps) ? `${e.targetSets || "?"} × ${e.targetReps || "?"}${e.targetReps ? " " + unit : ""}` : "";
      return { name: e.name || "", kind, target, sets: Array.from({ length: n }, () => ({ reps: "", hold: "", weight: "", rpe: "" })) };
    }),
  });
  const startSession = () => { if (hasDraft || programs.length > 0) setStarting(true); else openNewSession(); };

  const resolveIngredient = async (name) => {
    const key = name.trim().toLowerCase();
    const manual = foodLib.find((f) => (f.name || "").toLowerCase() === key && f.source === "manuel");
    if (manual) return manual;
    const fromDb = foodDbLookup(name);
    if (fromDb) return fromDb;
    const cached = foodLib.find((f) => f.name.toLowerCase() === key);
    if (cached) return cached;
    const fromAi = await aiLookupIngredient(name);
    if (fromAi) { persistFoodLib([...foodLib, fromAi]); return fromAi; }
    return { kcal: 0, protein: 0, carbs: 0, fat: 0, source: "inconnu" };
  };

  const isTodayTrainingDay = sessions.some((s) => s.date === todayISO()) || !!(plan[todayISO()] && (plan[todayISO()].kind === "run" || plan[todayISO()].kind === "program"));
  const clearDraft = (id) => { setDrafts((prev) => { const next = { ...prev }; if (id != null) delete next[id]; saveKey(KEY.drafts, next); return next; }); };
  const startBlank = (type) => openNewSession({ id: uid(), type, date: todayISO(), name: "", durationMin: "", rpe: "", feeling: "", notes: "", exercises: [{ name: "", sets: [{ reps: "", hold: "", weight: "", rpe: "" }] }], distanceKm: "", runKind: "continu", partners: [] });
  const resumeDraft = () => { if (pendingDraft) { setSessionDraft(pendingDraft); setOverlay("session"); } };

  return (
    <div className="min-h-screen font-sans" style={{ background: C.bg, color: C.text }}>
      <style>{`
        @keyframes cardIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
        @keyframes pulseOk { 0%{ transform:scale(1);} 40%{ transform:scale(1.08);} 100%{ transform:scale(1);} }
        @keyframes spinChrono { to { transform: rotate(360deg); } }
        @keyframes sheenSweep { 0%, 18% { left: -60%; } 58%, 100% { left: 140%; } }
        @keyframes doneIn { 0% { transform: scale(.6); } 55% { transform: scale(1.18); } 100% { transform: scale(1); } }
        .node-shine { position: relative; overflow: hidden; animation: doneIn .45s cubic-bezier(.34,1.56,.64,1); }
        .node-shine::after { content: ""; position: absolute; top: -55%; left: -60%; width: 55%; height: 220%;
          background: linear-gradient(115deg, transparent, rgba(255,255,255,.75), transparent);
          transform: rotate(15deg); animation: sheenSweep 3.4s ease-in-out infinite; }
        @keyframes setPop { 0%{ transform:scale(.5); } 60%{ transform:scale(1.18); } 100%{ transform:scale(1); } }
        .set-pop { animation: setPop .3s ease; }
        @keyframes unlockPulse { 0%,100% { box-shadow: 0 0 0 0 var(--pulse-color, transparent); } 50% { box-shadow: 0 0 0 9px var(--pulse-color, transparent); } }
        @keyframes glowPulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
        .unlock-pulse { animation: unlockPulse .55s ease-out 2; }
        .card-in { animation: cardIn .45s ease both; }
        .pastille { transition: background .35s ease, border-color .35s ease; }
        .bar-fill { transition: width .6s cubic-bezier(.4,0,.2,1); }
        .pulse-ok { animation: pulseOk .5s ease; }
        button:active { transform: scale(.97); }
        button { transition: transform .08s ease; }
      `}</style>

      <div className="px-4 pt-5 pb-3 flex items-center justify-between">
        <div>
          <div className="text-[10px] uppercase tracking-[0.3em] font-semibold" style={{ color: C.ember }}>Journal d'entraînement</div>
          <h1 className="text-xl font-extrabold tracking-tight">{profile.name ? `Salut, ${profile.name}` : "Ton suivi"}</h1>
        </div>
        <div className="flex items-center gap-2">
          {(hist.u > 0 || hist.r > 0) && (
            <div className="flex items-center rounded-full overflow-hidden" style={{ border: `1px solid ${C.border}` }}>
              <button onClick={undo} disabled={hist.u === 0} className="px-2.5 py-1.5 active:scale-95" style={{ opacity: hist.u === 0 ? 0.3 : 1 }}><Undo2 size={15} color={C.text} /></button>
              <div style={{ width: 1, alignSelf: "stretch", background: C.border }} />
              <button onClick={redo} disabled={hist.r === 0} className="px-2.5 py-1.5 active:scale-95" style={{ opacity: hist.r === 0 ? 0.3 : 1 }}><Redo2 size={15} color={C.text} /></button>
            </div>
          )}
          <div className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-[11px] font-semibold transition-colors ${saveState === "saved" ? "pulse-ok" : ""}`}
            style={{ background: saveState === "error" ? "#F8717118" : C.surface, border: `1px solid ${saveState === "saved" ? C.green : saveState === "error" ? "#F87171" : C.border}`, color: saveState === "saved" ? C.green : saveState === "error" ? "#F87171" : C.muted }}>
            {saveState === "saving" ? <><Loader size={12} className="animate-spin" /> Enregistrement…</>
              : saveState === "saved" ? <><Check size={12} /> Enregistré</>
              : saveState === "error" ? <><X size={12} /> Non sauvegardé</>
              : <><Check size={12} style={{ opacity: 0.5 }} /> Sauvegarde auto</>}
          </div>
          <button onClick={() => setOverlay("profile")} className="p-2 rounded-full" style={{ background: C.surface, border: `1px solid ${C.border}` }}><User size={20} color={C.text} /></button>
        </div>
      </div>

      <div className="px-4 pb-2">
        <div className="flex gap-1.5 p-1 rounded-xl" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          {[["training", "Entraînement", C.ember], ["nutrition", "Nutrition", C.teal]].map(([id, lbl, col]) => {
            const active = mode === id;
            return <button key={id} onClick={() => setMode(id)} className="flex-1 py-2 rounded-lg text-xs font-bold active:scale-[0.98]" style={{ background: active ? col + "22" : "transparent", color: active ? col : C.muted }}>{lbl}</button>;
          })}
        </div>
      </div>

      {storageError && (
        <div className="px-4 pb-2">
          <div className="rounded-xl p-3" style={{ background: "#F8717118", border: "1px solid #F87171" }}>
            <div className="font-bold text-sm flex items-center gap-1.5" style={{ color: "#F87171" }}><X size={15} /> Sauvegarde locale indisponible</div>
            <div className="text-[12px] mt-1" style={{ color: C.text }}>Ce contexte ne conserve pas tes données. Exporte via <b>Profil → Sauvegarde</b>.</div>
          </div>
        </div>
      )}

      {hasDraft && !overlay && !starting && (view === "home" || view === "sessions") && (
        <div className="px-4 pb-2">
          <div className="rounded-xl p-3" style={{ background: C.ember + "18", border: `1px solid ${C.ember}` }}>
            {!confirmDiscard ? (
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: C.ember + "22" }}><Dumbbell size={18} color={C.ember} /></div>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-sm">Séance en cours non terminée{draftList.length > 1 ? ` · ${draftList.length}` : ""}</div>
                  <div className="text-xs" style={{ color: C.muted }}>Exercices et temps chronométrés gardés</div>
                </div>
                <button onClick={resumeDraft} className="px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0" style={{ background: C.ember, color: "#0E1116" }}>Reprendre</button>
                <button onClick={() => setConfirmDiscard(true)} className="p-1 flex-shrink-0"><X size={16} color={C.muted} /></button>
              </div>
            ) : (
              <div className="flex items-center gap-3">
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-sm">Supprimer cette séance ?</div>
                  <div className="text-xs" style={{ color: C.muted }}>Définitif — exercices et temps perdus.</div>
                </div>
                <button onClick={() => { if (pendingDraft) clearDraft(pendingDraft.id); setConfirmDiscard(false); }} className="px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0" style={{ background: "#F87171", color: "#0E1116" }}>Supprimer</button>
                <button onClick={() => setConfirmDiscard(false)} className="px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0" style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}` }}>Annuler</button>
              </div>
            )}
          </div>
        </div>
      )}

      <div className="px-4 pb-28">
        {mode === "training" ? (
          <>
            {view === "home" && <HomeView stats={stats} sessions={sessions} plan={plan} goals={goals} motivation={motivation} skips={skips} onToggleSkip={toggleSkip} onNew={startSession} onStartType={startBlank} onDetail={setDetail} />}
            {view === "sessions" && <SessionsView sessions={sessions} onNew={startSession} onStartType={startBlank} onDetail={setDetail}
              onDelete={(id) => persistSessions(sessions.filter((s) => s.id !== id))}
              onDuplicate={(s) => { const c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.date = todayISO(); delete c.editing; openNewSession(c); }} />}
            {view === "agenda" && <PlanningView plan={plan} setPlan={persistPlan} programs={programs} sessions={sessions}
              onStartProgram={(p, date) => openNewSession(prefillFromProgram(p, date))} onDetail={setDetail} />}
            {view === "progress" && <ProgressView sessions={sessions} target={stats.target} />}
            {view === "goals" && <GoalsView goals={goals} setGoals={persistGoals}
              onAddFinal={() => { setGoalDraft({ kind: "final", parentId: null }); setOverlay("goal"); }}
              onAddStep={(pid) => { setGoalDraft({ kind: "step", parentId: pid }); setOverlay("goal"); }}
              onEditGoal={(goal) => { setGoalDraft({ ...goal, __edit: true }); setOverlay("goal"); }} />}
            {view === "programs" && <ProgramsView programs={programs} setPrograms={persistPrograms}
              onAdd={() => { setProgramDraft(null); setOverlay("program"); }}
              onEdit={(p) => { setProgramDraft(p); setOverlay("program"); }}
              onStart={(p) => openNewSession(prefillFromProgram(p))} />}
          </>
        ) : (
          <>
            {nutriView === "home" && <NutritionHomeView meals={meals} weightLog={weightLog} supplements={supplements} setSupplements={persistSupplements}
              nutriProfile={nutriProfile} isTrainingDay={isTodayTrainingDay} sessions={sessions} plan={plan} dayMeta={dayMeta}
              onEditProfile={() => setOverlay("nutriProfile")}
              onAddMeal={() => { setMealDraft(null); setOverlay("meal"); }}
              onEditMeal={(m) => { setMealDraft(m); setOverlay("meal"); }}
              onOpenDay={(d) => setNutriDayDate(d)} />}
            {nutriView === "evolution" && <NutritionEvolutionView meals={meals} sessions={sessions} plan={plan} nutriProfile={nutriProfile} dayMeta={dayMeta} onOpenDay={(d) => setNutriDayDate(d)} />}
            {nutriView === "mealsHistory" && <MealsHistoryView meals={meals}
              onAddMeal={() => { setMealDraft(null); setOverlay("meal"); }}
              onEditMeal={(m) => { setMealDraft(m); setOverlay("meal"); }} />}
            {nutriView === "weight" && <WeightView weightLog={weightLog} onAdd={(kg) => persistWeightLog([...weightLog, { date: todayISO(), kg }])} />}
          </>
        )}
      </div>

      <nav className="fixed bottom-0 inset-x-0 flex justify-around items-center py-2 border-t z-40"
        style={{ background: C.bg + "F2", borderColor: C.border, backdropFilter: "blur(8px)" }}>
        {(mode === "training" ? [
          { id: "home", icon: Home, label: "Accueil" },
          { id: "sessions", icon: Dumbbell, label: "Séances" },
          { id: "agenda", icon: CalendarDays, label: "Agenda" },
          { id: "progress", icon: TrendingUp, label: "Progrès" },
          { id: "goals", icon: Target, label: "Objectifs" },
          { id: "programs", icon: ClipboardList, label: "Prog." },
        ] : [
          { id: "home", icon: Utensils, label: "Nutrition" },
          { id: "mealsHistory", icon: ClipboardList, label: "Repas" },
          { id: "evolution", icon: TrendingUp, label: "Évolution" },
          { id: "weight", icon: Scale, label: "Poids" },
        ]).map((t) => {
          const currentView = mode === "training" ? view : nutriView;
          const setCurrentView = mode === "training" ? setView : setNutriView;
          const activeCol = mode === "training" ? C.ember : C.teal;
          const active = currentView === t.id;
          return (
            <button key={t.id} onClick={() => setCurrentView(t.id)} className="flex flex-col items-center gap-0.5 px-1 py-1 flex-1 min-w-0">
              <t.icon size={21} color={active ? activeCol : C.muted} />
              <span className="text-[9px] font-semibold truncate max-w-full" style={{ color: active ? activeCol : C.muted }}>{t.label}</span>
            </button>
          );
        })}
      </nav>

      {mode === "training" && (view === "home" || view === "sessions" || view === "agenda") && (
        <button onClick={startSession} className="fixed right-4 bottom-20 z-40 rounded-full w-14 h-14 flex items-center justify-center shadow-lg active:scale-95" style={{ background: C.ember }}>
          <Plus size={28} color="#0E1116" />
        </button>
      )}
      {mode === "nutrition" && (nutriView === "home" || nutriView === "mealsHistory") && (
        <button onClick={() => setQuickMeal(true)} className="fixed right-4 bottom-20 z-40 rounded-full w-14 h-14 flex items-center justify-center shadow-lg active:scale-95" style={{ background: C.teal }}>
          <Plus size={28} color="#0E1116" />
        </button>
      )}

      {starting && (
        <div className="fixed inset-0 z-50 flex items-end" style={{ background: "#0008" }} onClick={() => setStarting(false)}>
          <div className="w-full rounded-t-2xl p-4 pb-8" style={{ background: C.bg, border: `1px solid ${C.border}` }} onClick={(e) => e.stopPropagation()}>
            <div className="w-10 h-1 rounded-full mx-auto mb-4" style={{ background: C.border }} />
            <h3 className="font-bold text-lg mb-1">Nouvelle séance</h3>
            <p className="text-xs mb-4" style={{ color: C.muted }}>Suis un programme, ou pars sur une séance libre.</p>
            {hasDraft && (
              <button onClick={() => { setStarting(false); resumeDraft(); }} className="w-full flex items-center gap-3 rounded-xl p-3 mb-2 text-left" style={{ background: C.ember + "18", border: `1px solid ${C.ember}` }}>
                <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: C.ember + "22" }}><Play size={18} color={C.ember} /></div>
                <div className="flex-1"><div className="font-semibold text-sm" style={{ color: C.ember }}>Reprendre la séance en cours</div><div className="text-xs" style={{ color: C.muted }}>Exercices et temps gardés</div></div>
              </button>
            )}
            <button onClick={() => { setStarting(false); openNewSession(); }} className="w-full flex items-center gap-3 rounded-xl p-3 mb-2 text-left" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
              <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: C.sky + "22" }}><Footprints size={18} color={C.sky} /></div>
              <div><div className="font-semibold text-sm">Séance libre</div><div className="text-xs" style={{ color: C.muted }}>Course ou renfo, au choix</div></div>
            </button>
            {programs.map((p) => (
              <button key={p.id} onClick={() => { setStarting(false); openNewSession(prefillFromProgram(p)); }} className="w-full flex items-center gap-3 rounded-xl p-3 mb-2 text-left" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: C.ember + "22" }}><Dumbbell size={18} color={C.ember} /></div>
                <div className="flex-1"><div className="font-semibold text-sm">{p.name}</div><div className="text-xs" style={{ color: C.muted }}>{(p.exercises || []).length} exercices</div></div>
                <Play size={16} color={C.muted} />
              </button>
            ))}
          </div>
        </div>
      )}

      {quickMeal && (
        <div className="fixed inset-0 z-50 flex items-end" style={{ background: "#0008" }} onClick={() => setQuickMeal(false)}>
          <div className="w-full rounded-t-2xl p-4 pb-8" style={{ background: C.bg, border: `1px solid ${C.border}`, maxHeight: "85vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div className="w-10 h-1 rounded-full mx-auto mb-4" style={{ background: C.border }} />
            <h3 className="font-bold text-lg mb-1">Noter un repas</h3>
            <p className="text-xs mb-4" style={{ color: C.muted }}>Coche depuis un menu, re-loggue un repas récent, ou saisis manuellement.</p>
            <div className="grid grid-cols-2 gap-2 mb-4">
              {[["breakfast", "Petit-déj", "Petit-déjeuner", "Menu petit-déjeuner", Coffee, "matin"],
                ["lunch", "Déjeuner", "Déjeuner", "Menu déjeuner", Utensils, "midi"],
                ["dinner", "Dîner", "Dîner", "Menu dîner", Moon, "soir"],
                ["snack", "Collation", "Collation", "Menu collation", Sparkles, "midi"]].map(([key, label, mealName, title, Ic, period]) => (
                <button key={key} onClick={() => { setQuickMeal(false); setMenuPick({ menu: MEAL_MENUS[key === "dinner" ? "lunch" : key] || MEAL_MENUS.snack, title, mealName, period }); }}
                  className="flex items-center gap-2.5 rounded-xl p-3 text-left active:scale-[0.98]" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                  <div className="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: C.teal + "22" }}><Ic size={18} color={C.teal} /></div>
                  <span className="font-semibold text-sm">{label}</span>
                </button>
              ))}
            </div>
            {recentMeals.length > 0 && (
              <>
                <div className="text-[11px] uppercase tracking-wider font-bold mb-2" style={{ color: C.muted }}>Repas récents · 1 tap</div>
                <div className="space-y-2 mb-4">
                  {recentMeals.map((mm) => (
                    <button key={mm.id} onClick={() => { persistMeals([...meals, { ...JSON.parse(JSON.stringify(mm)), id: uid(), date: todayISO(), _ts: undefined }]); if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(18); setQuickMeal(false); }}
                      className="w-full flex items-center justify-between rounded-xl p-3 text-left active:scale-[0.99]" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                      <div className="flex items-center gap-3"><div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{ background: C.teal + "22" }}><RotateCcw size={15} color={C.teal} /></div><span className="text-sm font-semibold">{mm.name}</span></div>
                      <span className="font-mono text-sm">{mm.kcal} kcal</span>
                    </button>
                  ))}
                </div>
              </>
            )}
            <button onClick={() => { setQuickMeal(false); setMealDraft(null); setOverlay("meal"); }} className="w-full py-3 rounded-xl text-sm font-bold active:scale-95" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>Saisie manuelle (éditeur complet)</button>
          </div>
        </div>
      )}
      {menuPick && <FoodMenuPicker menu={menuPick.menu} title={menuPick.title} onCancel={() => setMenuPick(null)}
        onConfirm={(rows) => { persistMeals([...meals, mealFromMenuRows(rows, menuPick.mealName, todayISO(), foodLib, menuPick.period)]); if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(18); setMenuPick(null); }} />}

      {overlay === "session" && sessionDraft && (
        <SessionBuilder draft={sessionDraft} setDraft={setSessionDraft} hasDraft={hasDraft && !sessionDraft.editing} knownPartners={knownPartners} sessions={sessions}
          guide={(() => { const prog = programs.find((p) => p.id === sessionDraft.programId); return prog && prog.guide ? prog.guide : null; })()}
          guideTitle={(() => { const prog = programs.find((p) => p.id === sessionDraft.programId); return prog ? prog.name : ""; })()}
          onCancel={() => { setOverlay(null); setSessionDraft(null); }}
          onDiscard={() => { clearDraft(sessionDraft.id); setOverlay(null); setSessionDraft(null); }}
          onSave={(s) => {
            const { editing, _ts, ...clean } = s;
            const others = sessions.filter((x) => x.id !== clean.id);
            persistSessions([clean, ...others].sort((a, b) => b.date.localeCompare(a.date)));
            clearDraft(clean.id);
            if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(18);
            setOverlay(null); setSessionDraft(null);
          }} />
      )}
      {overlay === "goal" && <GoalForm initial={goalDraft} goals={goals} onCancel={() => { setOverlay(null); setGoalDraft(null); }}
        onSave={(g) => { const clean = { ...g }; delete clean.__edit; const exists = goals.some((x) => x.id === clean.id); persistGoals(exists ? goals.map((x) => (x.id === clean.id ? clean : x)) : [...goals, clean]); setOverlay(null); setGoalDraft(null); }} />}
      {overlay === "meal" && <MealBuilder initial={mealDraft} foodLib={foodLib} onLearnIngredient={(f) => persistFoodLib([...foodLib.filter(x=>x.name!==f.name),f])}
        onCancel={() => { setOverlay(null); setMealDraft(null); }}
        onDelete={(id) => { persistMeals(meals.filter((m) => m.id !== id)); setOverlay(null); setMealDraft(null); }}
        onSave={(m) => {
          const exists = meals.some((x) => x.id === m.id);
          persistMeals(exists ? meals.map((x) => (x.id === m.id ? m : x)) : [...meals, m]);
          if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(18);
          setOverlay(null); setMealDraft(null);
        }} />}
      {overlay === "nutriProfile" && <NutriProfileForm initial={nutriProfile} onCancel={() => setOverlay(null)} onSave={(p) => { persistNutriProfile(p); setOverlay(null); }} />}
      {overlay === "program" && <ProgramBuilder initial={programDraft} sessions={sessions}
        onCancel={() => { setOverlay(null); setProgramDraft(null); }}
        onSave={(p) => { const exists = programs.some((x) => x.id === p.id); persistPrograms(exists ? programs.map((x) => (x.id === p.id ? p : x)) : [...programs, p]); setOverlay(null); setProgramDraft(null); }} />}
      {overlay === "profile" && <ProfileForm profile={profile} onCancel={() => setOverlay(null)}
        onOpenBackup={() => setOverlay("backup")}
        onSave={(p) => { persistProfile(p); setOverlay(null); }} />}
      {overlay === "backup" && <BackupPanel
        data={{ profile, sessions, programs, goals, meals, weightLog, nutriProfile, dayMeta, skips }}
        onBack={() => setOverlay("profile")}
        onRestore={(d) => {
          if (d.profile) persistProfile(d.profile);
          if (d.sessions) persistSessions(d.sessions);
          if (d.programs) persistPrograms(d.programs);
          if (d.goals) persistGoals(d.goals);
          if (d.meals) persistMeals(d.meals);
          if (d.weightLog) persistWeightLog(d.weightLog);
        }} />}
      {nutriDayDate && <NutritionDaySheet date={nutriDayDate} meals={meals} sessions={sessions} plan={plan} nutriProfile={nutriProfile} dayMeta={dayMeta}
        onClose={() => setNutriDayDate(null)}
        onAddMeal={(d) => { setNutriDayDate(null); openNewMealForDate(d); }}
        onEditMeal={(m) => { setNutriDayDate(null); setMealDraft(m); setOverlay("meal"); }}
        onValidateDay={(d) => validateDay(d)} />}
      {detail && <SessionDetail session={detail} onBack={() => setDetail(null)}
        onDelete={() => { persistSessions(sessions.filter((s) => s.id !== detail.id)); setDetail(null); }}
        onDuplicate={() => { const copy = JSON.parse(JSON.stringify(detail)); copy.id = uid(); copy.date = todayISO(); delete copy.editing; setDetail(null); openNewSession(copy); }}
        onEdit={() => { setSessionDraft({ ...detail, editing: true }); setDetail(null); setOverlay("session"); }} />}
    </div>
  );
}



  // ─── Rendu ───────────────────────────────────────────────────────────────
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
  </script>

  <!-- Service Worker pour offline -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
