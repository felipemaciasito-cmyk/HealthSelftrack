<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Ajout rapide — test</title>
<style>
  :root{
    --bg:#0E1116; --surface:#171C24; --border:#2A323D;
    --text:#E8EBEF; --muted:#8A94A3; --ember:#FF6A3D; --teal:#2DD4BF;
    --green:#4ADE80; --red:#F87171;
  }
  *{box-sizing:border-box;margin:0;padding:0;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 26px);
    min-height:100vh;
  }
  h1{font-size:20px;font-weight:800;margin-bottom:4px}
  .sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.5}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:12px}
  .label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.14em;margin-bottom:9px}

  .mode{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
  .dot.off{background:var(--ember);box-shadow:0 0 10px var(--ember)}

  .verdict{border-radius:18px;padding:17px;margin-bottom:12px;border:1px solid}
  .verdict.good{background:#4ADE8014;border-color:#4ADE8066}
  .verdict.bad{background:#F8717114;border-color:#F8717166}
  .verdict .vt{font-size:16px;font-weight:800;margin-bottom:5px}
  .verdict.good .vt{color:var(--green)}
  .verdict.bad .vt{color:var(--red)}
  .verdict .vd{font-size:12.5px;line-height:1.55;opacity:.85}

  .row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--muted);font-size:12px}
  .row .v{font-weight:700;font-family:ui-monospace,Menlo,monospace}
  .v.ok{color:var(--teal)} .v.none{color:var(--muted);opacity:.55}

  .keys{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);line-height:1.8;word-break:break-all}
  .empty{font-style:italic;opacity:.6}

  a.back, button{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:15px;border-radius:15px;border:none;
    font-size:15px;font-weight:800;font-family:inherit;
    text-decoration:none;margin-top:8px;
  }
  a.back{background:var(--ember);color:#1a0e08}
  button{background:transparent;border:1px solid var(--border);color:var(--muted);font-weight:700}
  a.back:active, button:active{transform:scale(.98)}
</style>
</head>
<body>
  <h1>Ajout rapide — test</h1>
  <div class="sub">Cette page vérifie si, ouverte depuis l'intérieur de l'appli, elle voit bien tes données.</div>

  <div class="card">
    <div class="label">COMMENT CETTE PAGE EST OUVERTE</div>
    <div class="mode"><span class="dot" id="modeDot"></span><span id="modeTxt">…</span></div>
  </div>

  <div class="verdict" id="verdict">
    <div class="vt" id="verdictTitle">Analyse…</div>
    <div class="vd" id="verdictDesc"></div>
  </div>

  <div class="card">
    <div class="label">TES DONNÉES</div>
    <div id="appData"></div>
  </div>

  <div class="card">
    <div class="label">CLÉS VISIBLES</div>
    <div class="keys" id="allKeys"></div>
  </div>

  <a class="back" href="index.html">← Retour à l'appli</a>
  <button id="refresh">Rafraîchir</button>

<script>
(function(){
  var P = 'pdm:';
  function standalone(){
    return (window.navigator.standalone === true) ||
           (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  function parse(k){
    try { var r = localStorage.getItem(P+k); return r===null?null:JSON.parse(r); }
    catch(e){ return null; }
  }
  function render(){
    var sa = standalone();
    document.getElementById('modeDot').className = 'dot ' + (sa?'on':'off');
    document.getElementById('modeTxt').textContent = sa
      ? "Depuis l'appli (mode app)" : "Dans Safari (onglet normal)";

    var w = parse('ft:weightLog'), s = parse('ft:sessions'),
        m = parse('ft:meals'), su = parse('ft:supplements');
    var last = (w && w.length) ? w[w.length-1] : null;

    var rows = [
      ['Pesées', w ? w.length : null],
      ['Dernier poids', last ? (last.kg + ' kg') : null],
      ['Séances', s ? s.length : null],
      ['Repas', m ? m.length : null],
      ['Jours avec compléments', su ? Object.keys(su).length : null]
    ];
    var h = '';
    for(var i=0;i<rows.length;i++){
      var has = rows[i][1] !== null && rows[i][1] !== undefined;
      h += '<div class="row"><span class="k">'+rows[i][0]+'</span><span class="v '+
           (has?'ok':'none')+'">'+(has?rows[i][1]:'rien')+'</span></div>';
    }
    document.getElementById('appData').innerHTML = h;

    var keys = [];
    try {
      for(var j=0;j<localStorage.length;j++){
        var k = localStorage.key(j);
        if(k && k.indexOf(P) === 0) keys.push(k);
      }
    } catch(e){}
    document.getElementById('allKeys').innerHTML = keys.length
      ? keys.join('<br/>') : '<span class="empty">Aucune clé trouvée.</span>';

    var v = document.getElementById('verdict');
    var hasSessions = s && s.length > 0;
    if(keys.length > 0 && hasSessions){
      v.className = 'verdict good';
      document.getElementById('verdictTitle').textContent = 'Coffre partagé ✓';
      document.getElementById('verdictDesc').textContent =
        "Cette page voit tes vraies données. L'ajout rapide peut être une page séparée, ouverte depuis l'appli.";
    } else if(keys.length > 0){
      v.className = 'verdict good';
      document.getElementById('verdictTitle').textContent = 'Coffre partagé, mais peu de données';
      document.getElementById('verdictDesc').textContent =
        "Des clés sont visibles mais aucune séance. Vérifie que tu es bien arrivé ici depuis l'icône de l'appli.";
    } else {
      v.className = 'verdict bad';
      document.getElementById('verdictTitle').textContent = 'Coffre séparé';
      document.getElementById('verdictDesc').textContent =
        "Aucune donnée visible. Même en naviguant depuis l'appli, le stockage reste cloisonné : il faudra intégrer l'ajout rapide dans le bundle.";
    }
  }
  document.getElementById('refresh').addEventListener('click', render);
  render();
})();
</script>
</body>
</html>
